html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:var(--ui);cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 背景舞台（更饱和的光晕，让玻璃透出颜色） ---------- */
#stage{position:absolute;inset:0;transition:opacity .6s;cursor:pointer}
#bg{position:absolute;inset:0;transition:background 1s}
#deco{position:absolute;right:6%;top:10%;font-size:110px;opacity:.09;filter:grayscale(50%);pointer-events:none}
#fog{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 115%,rgba(0,0,0,0) 45%,rgba(0,0,0,.42) 100%);pointer-events:none}
.bg-market{background:radial-gradient(ellipse at 75% -10%,rgba(240,170,90,.17),transparent 55%),radial-gradient(ellipse at 10% 90%,rgba(124,185,168,.10),transparent 50%),linear-gradient(180deg,#181410 0%,#0d0d10 70%)}
.bg-station{background:radial-gradient(ellipse at 20% -10%,rgba(110,160,230,.16),transparent 55%),linear-gradient(180deg,#0f1218 0%,#0d0d10 70%)}
.bg-jinhan{background:radial-gradient(ellipse at 50% -10%,rgba(235,100,85,.18),transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(232,192,122,.08),transparent 50%),linear-gradient(180deg,#190e10 0%,#0d0d10 70%)}
.bg-tower{background:radial-gradient(ellipse at 80% 100%,rgba(210,180,100,.12),transparent 55%),linear-gradient(180deg,#101318 0%,#0d0d10 70%)}
.bg-rain{background:radial-gradient(ellipse at 50% -10%,rgba(130,155,200,.13),transparent 55%),linear-gradient(180deg,#0f1216 0%,#0c0c0f 70%)}
.bg-cell{background:radial-gradient(ellipse at 50% 100%,rgba(195,141,148,.08),transparent 60%),linear-gradient(180deg,#141418 0%,#0d0d10 100%)}
.bg-dawn{background:radial-gradient(ellipse at 50% 110%,rgba(245,175,95,.2),transparent 60%),linear-gradient(180deg,#181510 0%,#0d0d10 70%)}

/* ---------- 顶部：玻璃条 ---------- */
#hud{position:relative;z-index:5;display:none;flex-wrap:wrap;align-items:center;gap:4px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(14,14,18,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -1px 0 rgba(255,255,255,.04)}
#chTag{flex:1 1 auto;color:var(--dim);font-size:12.5px;font-weight:700;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sndBtn{flex:none;background:var(--glass-2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 13px;font-size:12px;
  box-shadow:inset 0 1px .5px rgba(255,255,255,.18);transition:background .2s}
#sndBtn:active{background:rgba(255,255,255,.14)}
#chipRow{flex:1 1 100%;display:flex;gap:7px;overflow-x:auto;margin-top:9px;scrollbar-width:none;padding-bottom:2px}
#chipRow::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 12px;border:1px solid rgba(255,255,255,.11);
  border-radius:999px;background:rgba(255,255,255,.06);color:#c2c2c8;white-space:nowrap;flex:none;position:relative;
  box-shadow:inset 0 1px .5px rgba(255,255,255,.16)}
.chip b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.chip.warn{border-color:rgba(224,122,106,.4);background:rgba(224,122,106,.1);color:#f0a99d;animation:pulse 1.4s infinite}
.chip.btn{cursor:pointer}
.chip.btn:active{background:rgba(255,255,255,.13)}
.flo{position:absolute;right:6px;top:-4px;font-size:11px;font-weight:700;pointer-events:none;animation:flo 1.1s forwards}
.flo.up{color:var(--green)}.flo.dn{color:var(--red)}
@keyframes flo{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-14px)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(224,122,106,.16),inset 0 1px .5px rgba(255,255,255,.16)}}

/* ---------- 底部悬浮玻璃导航 ---------- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:40;display:none;gap:2px;background:rgba(22,23,30,.42);backdrop-filter:blur(26px) saturate(1.9);-webkit-backdrop-filter:blur(26px) saturate(1.9);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.32),inset 0 -1px 1px rgba(255,255,255,.07),0 20px 50px rgba(0,0,0,.55)}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;
  color:var(--dim);font-size:11px;font-weight:500;padding:8px 26px;border-radius:999px;transition:background .2s}
.navbtn:active{background:rgba(255,255,255,.14)}
.navbtn .ni{font-size:20px;line-height:1.2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* ---------- 对话区（主玻璃卡） ---------- */
#bottom{position:relative;z-index:5;margin-top:auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer}
#dlg{width:100%;max-width:520px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.14);border-radius:30px;padding:20px 18px 32px;min-height:126px;position:relative;
  box-shadow:var(--rim),0 24px 64px rgba(0,0,0,.52)}
#dlg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 34%,rgba(255,255,255,0) 58%)}
#who{position:absolute;top:-15px;left:16px;display:inline-flex;align-items:center;gap:7px;background:rgba(18,18,24,.66);
  backdrop-filter:blur(12px) saturate(1.5);border:1px solid rgba(255,255,255,.15);border-radius:999px;
  padding:4px 13px 4px 5px;font-size:13px;font-weight:600;letter-spacing:.5px;box-shadow:inset 0 1px .5px rgba(255,255,255,.22),0 6px 18px rgba(0,0,0,.35)}
#who .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
#txt{font-size:17px;line-height:1.9;color:var(--ink);min-height:70px;white-space:pre-wrap}
#hint{position:absolute;right:18px;bottom:12px;font-size:11px;color:var(--dim2);opacity:.85;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- Q版人物立绘 ---------- */
#chibi{position:absolute;right:12px;bottom:100%;width:78px;margin-bottom:-27px;pointer-events:none;z-index:6;
  opacity:0;transform:translateY(10px) scale(.86);transition:opacity .45s ease-out,transform .45s ease-out}
#chibi.show{opacity:1;transform:translateY(0) scale(1)}
#chibi::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,0) 70%)}
#chibi svg{display:block;width:100%;position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));animation:bob 3.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

/* ---------- 选项（玻璃票据卡） ---------- */
#choices{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.choice{position:relative;text-align:left;background:rgba(26,27,34,.44);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  border:1px solid rgba(255,255,255,.13);border-radius:22px;color:var(--ink);
  font-size:15px;font-weight:500;padding:14px 40px 13px 52px;line-height:1.55;min-height:54px;
  box-shadow:inset 0 1px .8px rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.32);
  transition:transform .15s,background .15s,border-color .15s;animation:cardIn .3s ease-out backwards}
.choice:nth-child(2){animation-delay:.05s}
.choice:nth-child(3){animation-delay:.1s}
.choice:nth-child(4){animation-delay:.15s}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.choice::before{content:"";position:absolute;left:17px;top:17px;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);box-shadow:inset 0 1px .5px rgba(255,255,255,.25)}
.choice::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-52%);color:rgba(255,255,255,.28);font-size:20px;line-height:1}
.choice:active{transform:scale(.98);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.choice .fx{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-weight:400}
.choice.lock{opacity:.4}
.choice.lock::before{content:"🔒";border:none;width:auto;height:auto;font-size:12px;left:15px;top:17px}
.choice.cardOpt{background:rgba(74,58,26,.4);border-color:rgba(232,192,122,.35)}
.choice.cardOpt::before{content:"🃏";border:none;width:auto;height:auto;font-size:15px;left:15px;top:15px}

/* ---------- 覆盖层 ---------- */
.ovl{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:24px;overflow:auto}
.ovl.show{display:flex}
#era,#title,#ending,#gallery{background:rgba(9,9,12,.86);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
#wave,#panel{background:rgba(9,9,12,.66);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5)}

#era .y{font-size:12px;letter-spacing:6px;color:var(--dim);margin-bottom:14px}
#era .t{font-size:36px;font-weight:800;letter-spacing:7px;color:var(--ink)}
#era .s{margin-top:16px;color:var(--dim);font-size:14px;line-height:1.9;max-width:330px}
#era .go{margin-top:44px;background:var(--ink);color:#111;border:none;border-radius:999px;
  padding:14px 48px;font-size:15px;font-weight:700;transition:transform .15s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#era .go:active{transform:scale(.96)}

#title{background:radial-gradient(ellipse at 50% 24%,rgba(52,54,66,.7),rgba(10,10,14,.94) 72%)}
#title::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:5px;border-radius:99px;background:rgba(255,255,255,.14)}
#title .fish{font-size:58px;margin-bottom:12px;filter:drop-shadow(0 0 38px rgba(255,255,255,.3))}
#title h1{font-size:42px;font-weight:800;letter-spacing:8px;color:var(--ink)}
#title .sub{margin-top:10px;color:var(--dim);letter-spacing:4px;font-size:13px;font-weight:600}
#title .desc{margin-top:14px;color:var(--dim);font-size:13px;line-height:2;max-width:340px}
#title .btns{margin-top:32px;display:flex;flex-direction:column;gap:10px;width:min(320px,84vw)}
.mbtn{background:rgba(255,255,255,.07);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
  border:1px solid rgba(255,255,255,.14);color:var(--ink);border-radius:999px;padding:14px 20px;
  font-size:15px;font-weight:600;letter-spacing:2px;box-shadow:inset 0 1px .6px rgba(255,255,255,.22),0 10px 28px rgba(0,0,0,.3);transition:transform .15s,background .15s}
.mbtn:active{transform:scale(.97);background:rgba(255,255,255,.13)}
.mbtn.pri{background:var(--ink);color:#111;border-color:var(--ink);box-shadow:0 12px 32px rgba(255,255,255,.08)}

/* ---------- 结局 ---------- */
#endCard{position:relative;width:100%;max-width:430px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:26px 24px 22px;text-align:left;
  box-shadow:var(--rim),0 28px 76px rgba(0,0,0,.58)}
#endCard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 36%,rgba(255,255,255,0) 58%)}
#endCard .tag{color:var(--dim2);letter-spacing:3px;font-size:11px}
#endName{font-size:29px;font-weight:800;letter-spacing:4px;margin:8px 0 4px;color:var(--gold)}
#endGrade{position:absolute;right:22px;top:22px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  font-size:27px;font-weight:800;border:3px solid var(--gold);color:var(--gold);
  background:rgba(232,192,122,.08);box-shadow:inset 0 1px .6px rgba(255,255,255,.25)}
#endText{font-size:14px;line-height:1.9;color:#dedee2;margin:12px 0 14px;white-space:pre-wrap}
#fates{border-top:1px solid rgba(255,255,255,.09);padding-top:12px;display:grid;gap:5px;font-size:12.5px;color:var(--dim)}
#fates b{color:var(--ink);margin-right:8px;font-weight:600}
#endStats{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
#endStats span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 10px;color:var(--dim)}
#endBtns{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
#endBtns .mbtn{padding:12px 16px;font-size:13.5px;flex:1;letter-spacing:1px}

/* ---------- 图鉴 / 面板 ---------- */
#gallery h2{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--ink);margin-bottom:14px}
#gGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.gslot{border-radius:18px;padding:14px;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.14)}
.gslot.on{background:rgba(232,192,122,.1);border-color:rgba(232,192,122,.3)}
.gslot .gn{font-size:15px;font-weight:700;color:var(--ink)}
.gslot.on .gn{color:var(--gold)}
.gslot .gd{margin-top:5px;font-size:11.5px;color:var(--dim);line-height:1.65}
.gslot.off{opacity:.45}

.panelCard{width:100%;max-width:420px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:20px;max-height:84vh;overflow:auto;text-align:left;
  box-shadow:var(--rim),0 26px 70px rgba(0,0,0,.55)}
.panelCard::before{content:"";position:absolute;display:none}
.pTitle{font-size:18px;font-weight:800;letter-spacing:4px;color:var(--ink);margin-bottom:10px}
.affRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.affRow .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);font-size:14px;flex:none}
.affRow .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.affRow .bar i{display:block;height:100%;border-radius:99px}
.affRow .st{width:132px;font-size:10.5px;color:var(--dim);text-align:right;flex:none}
.cardRow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px;align-items:flex-start}
.cardRow .cn{color:var(--gold);font-weight:700;flex:none}
.cardRow .cd{color:var(--dim);line-height:1.7}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--dim);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600}
.tabs button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.achGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:440px}
.ach{border-radius:16px;padding:12px;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.ach.on{background:rgba(232,192,122,.1);border-color:rgba(232,192,122,.3)}
.ach .an{font-size:13px;font-weight:700;color:var(--ink)}
.ach.on .an{color:var(--gold)}
.ach .ad{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.6}
.ach.off{opacity:.45}

/* ---------- 风浪回合 ---------- */
.waveCard{width:100%;max-width:440px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:22px 20px 16px;
  text-align:left;max-height:88vh;overflow:auto;box-shadow:var(--rim),0 24px 68px rgba(0,0,0,.55)}
.waveCard::before{content:"";position:absolute;display:none}
.wEra{color:var(--dim2);letter-spacing:2px;font-size:11px}
.wTitle{font-size:24px;font-weight:800;letter-spacing:5px;color:var(--ink);margin:6px 0 2px}
.wTurn{font-size:12.5px;color:var(--dim);margin-bottom:4px}
.wHint{font-size:12px;color:var(--dim2);margin-bottom:12px}
.wActs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wAct{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;color:var(--ink);padding:12px;text-align:left;
  font-size:13.5px;font-weight:600;box-shadow:inset 0 1px .5px rgba(255,255,255,.15);transition:transform .15s,background .15s}
.wAct:active{transform:scale(.97);background:rgba(255,255,255,.13)}
.wAct .wd{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-weight:400}
.wLog{margin-top:10px;font-size:12.5px;color:var(--green);min-height:16px;line-height:1.7;white-space:pre-wrap}
#evBox{margin:8px 0 2px;border-radius:18px;padding:12px;background:rgba(232,192,122,.08);border:1px solid rgba(232,192,122,.22)}
#evBox .et{color:var(--gold);font-size:14.5px;font-weight:700;margin-bottom:5px}
#evBox .ed{font-size:12.5px;line-height:1.75;color:#dedee2;margin-bottom:10px}
.wSkip{margin-top:12px;background:none;border:1px solid rgba(255,255,255,.14);color:var(--dim2);border-radius:999px;padding:7px 16px;font-size:11.5px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
  background:rgba(30,31,38,.72);backdrop-filter:blur(16px) saturate(1.6);border:1px solid rgba(255,255,255,.16);color:var(--gold);
  border-radius:999px;padding:9px 20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;
  box-shadow:inset 0 1px .6px rgba(255,255,255,.2),0 12px 32px rgba(0,0,0,.4)}
#toast.show{opacity:1}

/* ---------- 第三视角场景插画 ---------- */
#sceneArt{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneEnv,#sceneEnv svg{position:absolute;inset:0;width:100%;height:100%}
#sceneArt .fig{position:absolute;bottom:19%;transition:opacity .5s ease-out}
#sceneArt .fig svg{display:block;width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#figL{left:9%;width:15%;min-width:96px}
#figR{right:9%;width:13.5%;min-width:88px}
#deco{display:none}
#chibi{display:none}
.bg-rain::after{content:"";position:absolute;inset:-40% -10%;pointer-events:none;
  background:repeating-linear-gradient(78deg,rgba(190,210,240,.08) 0 1.5px,transparent 1.5px 10px);
  animation:rainmove .6s linear infinite}
@keyframes rainmove{from{transform:translateY(0)}to{transform:translateY(22px)}}

@media (min-width:720px){
  #bottom{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="bg" class="bg-market"></div><div id="sceneArt"><div id="sceneEnv" style="transition:opacity .8s ease-out"></div><div class="fig" id="figL"></div><div class="fig" id="figR"></div></div><div id="deco">🐟</div><div id="fog"></div></div>
  <div id="hud">
    <span id="chTag">序章</span>
    <span class="chip" id="c_money">💰 资金 <b>0</b></span>
    <span class="chip" id="c_rep">🐟 声望 <b>0</b></span>
    <span class="chip" id="c_con">🤝 人脉 <b>0</b></span>
    <span class="chip" id="c_risk">⚠️ 风险 <b>0</b></span>
    <span class="chip" id="c_heart">❤️ 初心 <b>0</b></span>
    <span class="chip btn" id="c_cards" title="谋略卡">🃏 <b>0</b></span>
    <span class="chip btn" id="c_aff" title="人物好感">👥 好感</span>
    <span class="chip" id="c_flag" style="display:none"></span>
    <button id="sndBtn" title="音效开关">🔊 音效</button>
  </div>
  <div id="bottom">
    <div id="choices"></div>
    <div id="dlg"><div id="chibi"></div><div id="who"><span class="av" id="whoAv">🐟</span><span id="whoName">高启强</span></div>
      <div id="txt"></div><div id="hint">点击继续 ▸</div></div>

c1_8:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","半个月后，一张烫金请帖塞进鱼摊：白金瀚夜总会，徐老板请你喝茶。"],
  ["xu","高启强。旧厂街的高启强。我儿子的命，没在你那鱼池里，我派人查了二十遍。你说说，你一个卖鱼的，那天晚上到底看见什么了？"],
  ["qin","他眼睛是红的。丧子的人，刀架在你脖子上都不解恨。"]],
 choices:[
  {t:"『扑通』跪下：徐老板饶命，我真的什么都没看见",fx:{rep:-10,heart:-6},set:{guiguo:true},note:"声望 -10",next:"c1_9"},
  {t:"一句不说，硬扛着他的目光",fx:{heart:-2,rep:4},note:"声望 +4",next:"c1_9"},
  {t:"翻开《孙子兵法》的底子：『徐老板，配电箱漏电，电工的检修记录我抄了一份。您要真凶，先查电。』",req:{stat:"con",min:8},fx:{con:6,rep:8,risk:6},note:"人脉 +6 声望 +8",next:"c1_9"}],
 cardOpts:{mantian:{t:"顺着他的话，把『查电』的差事应下来——拖字诀走起",fx:{risk:-8,rep:2},next:"c1_9"}}},
c1_9:{bg:"bg-rain",deco:"🔪",
 lines:[
  ["me","茶没喝完，事情就来了。当夜，四条汉子堵了鱼摊，铁棍敲得案板梆梆响：徐老板说了，鱼摊明天就别开了。"],
  ["qin","手边有杀鱼刀，案板上还有半条冻得梆硬的带鱼。命，和往后二十年的路，都在这一下。"]],
 choices:[
  {t:"拎起冻鱼，跟他们拼了！",fx:{rep:10,risk:12,heart:-8},set:{eming:true},note:"声望 +10 风险 +12",next:"c1_10"},
  {t:"抄起名片打给安欣，死死守住电话不挂",fx:{heart:6,risk:-6,rep:2},note:"初心 +6 风险 -6",next:"c1_10"},
  {t:"把攒的五千块钱全推过去，破财消灾",fx:{money:-5000,heart:-4},note:"资金 -5000",next:"c1_10"}]},
c1_10:{bg:"bg-market",deco:"🌅",
 lines:[
  ["me","那条街还是那条街。鱼还是要进，秤还是要摆。可旧厂街的人再看你，眼神不一样了。"],
  ["qin","风浪来过了。有人被浪打翻，有人学会了踩着浪走。我想做后一种。"]],
 choices:[
  {t:"本本分分卖鱼，供弟妹读完书，别的不沾",fx:{heart:8,rep:2,money:1000},set:{anfen:true},note:"初心 +8",next:"c1_chk"},
  {t:"提两瓶好酒，去拜泰叔的码头，想活得好就得有人罩着",fx:{con:8,risk:8,rep:4,money:-1000},note:"人脉 +8 风险 +8",next:"c1_chk"},
  {t:"拉上启盛倒腾电器BB机，做生意攒本钱",fx:{money:3000,con:3,rep:2},note:"资金 +3000",next:"c1_chk"}]},
c1_chk:{hidden:true,route:s=>s.risk>=70?"g_rain":"w1",alt:["g_rain","w1"]},
w1:{wave:"w1",next:"c2_1a"},

/* ---------- 第二章 2006 · 风起于萍末 ---------- */
c2_1a:{era:{y:"第 二 章 · 二 ○ ○ 六",t:"风起于萍末",s:"白金瀚的霓虹，比鱼市的白炽灯亮得多，也烫得多。",chap:2},next:"c2_1"},
c2_1:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["me","六年，弹指一挥。旧厂街的鱼摊变成了水产档口，你的名字在京海的水产圈里有了分量。这一年，两个女人一个男人，先后走进你的命里。"],
  ["sao","高老板，坐。听说徐江的人为难你？我是陈书婷，白家的当家人。京海地面上的事，轮不到他一个人说了算。"]],next:"c2_2"},
c2_2:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","我这人不喜欢绕弯子。白金瀚、白家的场子，缺一个能压得住场面的人。你敢不敢接？"],
  ["qin","她递过来的不是酒杯，是一把椅子。接，还是不接。"]],next:"c2_2b"},
c2_2b:{bg:"bg-market",deco:"🔪",
 lines:[
  ["me","菜场西口，一个刚出狱的男人守着个修车摊，被人掀了摊子也不还手。你认得他——老默，当年进去了几年，出来老婆没了，就剩一个闺女。"],
  ["mo","高老板。不用可怜我。我就是……想给丫丫挣个学费。"],
  ["qin","这人眼里有一种东西，像深海里的鱼，不出声，但知道往哪儿游。"]],
 choices:[
  {t:"『西口那个摊位归你。往后你跟我，我养你们父女。』",fx:{heart:6,con:5,affMo:8},set:{laomo:true},note:"初心 +6 人脉 +5",next:"c2_3"},
  {t:"雇他看场子，但钱按行价再压三成——便宜好用",fx:{con:6,heart:-4,affMo:4},set:{laomo:true},note:"人脉 +6",next:"c2_3"},
  {t:"点头致意，各过各的日子",fx:{heart:2,affMo:1},note:"初心 +2",next:"c2_3"}]},
c2_3:{bg:"bg-jinhan",deco:"🐺",
 lines:[
  ["me","徐江的时代到头了。线人反水、账本外流、白金瀚的股东连夜撤资，他成了京海人人都想踩一脚的落水狗。今夜，他孤身来见你。"],
  ["xu","高启强！成王败寇，我认。但京海这么大，你就不怕我姓徐的哪天缓过来，再跟你算今天的账？"],
  ["qin","他身后已经没有兄弟了。可饿狼就是饿狼。"]],
 choices:[
  {t:"递给老默一根烟：『告诉老默，我想吃鱼了。』",req:{flag:"laomo"},fx:{rep:12,risk:14,heart:-10},set:{xuezhai1:true},note:"声望 +12 风险 +14",next:"c2_4"},
  {t:"连夜把他和账目一起送到安欣手里，交由法律发落",fx:{heart:10,risk:-8,rep:6},note:"初心 +10 风险 -8",next:"c2_4"},
  {t:"放他离开京海：『我高启强不斩落水狗。』",fx:{rep:-4,risk:8,heart:2},set:{fanghu:true},note:"风险 +8",next:"c2_4"}],
 cardOpts:{jiedao:{t:"把徐江仇家的名单，递给急着上位的人",fx:{rep:10,con:4,heart:-8,risk:4},next:"c2_4"}}},
c2_4:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","泰叔的寿宴。满堂宾客里，老爷子招手让你过去，把一根不离手的枣木拐杖放在你面前。"],
  ["tai","启强啊。这根拐杖，我拄了三十年，京海没人敢扶。今天你扶一下试试？"],
  ["qin","满场的人都盯着。这一扶，就是他陈泰的人了。"]],next:"c2_5"},
c2_5:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["qin","扶，还是不扶。"]],
 choices:[
  {t:"双膝跪地，端茶认干爹：『爹在上，受儿子一拜。』",fx:{con:12,rep:6,heart:-8},set:{taishu:true},note:"人脉 +12 声望 +6",next:"c2_5b"},
  {t:"不跪。双手抱拳，只把拐杖扶正放好：『叔，我敬您，但跪不下去。』",fx:{rep:10,con:4},set:{yinggutou:true},note:"声望 +10",next:"c2_5b"}],
 cardOpts:{fanke:{t:"不跪也不接——反手把白金瀚三成干股的协议推到泰叔面前",fx:{rep:14,con:8,heart:-2},set:{pingdeng:true},next:"c2_5b"}}},
c2_5b:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","高启强，跟着你这几年，我看得明白：你这个人，心里有一杆秤。我的场子，我这个人，你敢不敢一起接？"],
  ["qin","大嫂笑了。京海谁不知道，能得到陈书婷一句『敢』，半个白金瀚就姓了高。"]],
 choices:[
  {t:"『娶。这辈子，高启强明媒正娶。』",fx:{rep:8,heart:4,affSao:8},set:{marry:true},note:"声望 +8",next:"c2_6"},
  {t:"『书婷，我现在满手是泥，配不上你。等我洗干净……』",fx:{rep:-6,heart:6,affSao:3},note:"初心 +6",next:"c2_6"}]},
c2_6:{bg:"bg-tower",deco:"🕶️",
 lines:[
  ["me","这一年，启盛的小灵通柜台开进了三家商场。他站在柜台后面给人家讲『信号增强专利』，眼睛亮得吓人。"],
  ["sheng","哥，柜台叫什么名字，我想好了——就叫『强盛』。强的强，盛的盛。咱高家，从此往上走！"],
  ["qin","强盛。鱼摊的名字跟着我们二十年了，从今天起，它有了新的意思。"]],
 choices:[
  {t:"把全部积蓄押进去，兄弟俩合伙干",fx:{money:-20000,rep:8,con:6,affSheng:4},set:{qiangsheng:true},note:"资金 -20000 声望 +8",next:"c2_7"},
  {t:"只出面子不出钱：『哥给你站台，账你自己管。』",fx:{rep:4,con:3,affSheng:3},set:{qiangsheng:true},note:"声望 +4",next:"c2_7"},
  {t:"劝他收手：『小灵通火不了几年，安安稳稳比什么都强。』",fx:{heart:6,rep:-4,affSheng:2},note:"初心 +6",next:"c2_7"}]},
c2_7:{bg:"bg-jinhan",deco:"🌃",
 lines:[
  ["me","2006年冬天，『强盛商贸有限公司』挂牌。鞭炮屑落满门口，像一场红色的雪。"],
  ["me","泰叔老了，白金瀚的钥匙一点点挪进你口袋。京海的人提起高启强，不再说『卖鱼的』，而是压低声音说——『强哥』。"]],
 choices:[
  {t:"接下他递来的烟，陪他在天台看一夜的京海",fx:{rep:4,con:4,risk:4},note:"声望 +4 人脉 +4",next:"c2_chk"},
  {t:"把烟掐了：『叔，烟伤肺。咱们讲生意。』",fx:{rep:6,heart:2},note:"声望 +6",next:"c2_chk"}]},
c2_chk:{hidden:true,route:s=>s.risk>=75?"g_gun":"w2",alt:["g_gun","w2"]},
w2:{wave:"w2",next:"c3_1a"},

/* ---------- 第三章 2015 · 京海之巅 ---------- */
c3_1a:{era:{y:"第 三 章 · 二 ○ 一 五",t:"京海之巅",s:"强盛大厦六十六层，整面落地窗外，就是整个京海。",chap:3},next:"c3_1"},
c3_1:{bg:"bg-tower",deco:"🏙️",
 lines:[
  ["me","2015年。强盛集团总部大楼落成，66层，京海第三高楼。剪彩那天的红绸，比当年鱼摊的塑料袋贵一万倍。"],
  ["me","地产、商贸、娱乐、物流——集团的版图铺满京海。你站在顶层落地窗前，脚下是车流，是灯火，是你从鱼摊一步一步走上来的这座城。"],
  ["qin","风浪越大，鱼越贵。这句话，我用了十五年。"]],next:"c3_2"},
c3_2:{bg:"bg-tower",deco:"🎩",
 lines:[
  ["me","深夜，一辆黑色轿车停进地下车库。市委常委、政法委书记赵立冬的秘书递来一份文件。"],
  ["zhao","高总，强盛能长这么大，靠什么，你心里有数吧。市里项目要做优做大，你这两成干股，就是投名状。往后你的事，就是我的事。"],
  ["qin","官帽比黑金可怕，也比黑金好使。可这东西一旦接了，就再没有回头路。"]],
 choices:[
  {t:"签字，递干股。这把伞，不要白不要",fx:{con:12,risk:18,heart:-12},set:{sanhu:true},note:"人脉 +12 风险 +18",next:"c3_3"},
  {t:"虚与委蛇：『赵书记，容我先做做股东们的思想工作。』",fx:{con:4,risk:8},note:"风险 +8",next:"c3_3"},
  {t:"当场拒绝，顺手把录音笔留在了茶几上",fx:{risk:20,heart:6},set:{babing:true},note:"风险 +20 初心 +6",next:"c3_3"}],
 cardOpts:{jinchani:{t:"假意应承，把干股挂进三家空壳公司里",fx:{con:6,risk:4},next:"c3_3"}}},
c3_3:{bg:"bg-rain",deco:"🌩️",
 lines:[
  ["me","莽村的旧厂改造，村民堵了强盛的工地三个月。谈判那天，李宏伟带着人掀了桌，泼了启盛一身茶。"],
  ["me","三天后，李宏伟被发现死在冷库，凶器——是一条冻鱼。启盛坐在审讯室里，眼镜碎了，笑得很平静。"],
  ["sheng","哥，我替你把脏活干了。你说过，风浪越大，鱼越贵。"],
  ["qin","我什么时候让你去杀人了！……启盛是我弟弟。这一步怎么落，落下去就再也收不回来。"]],
 choices:[
  {t:"动用一切关系把案子压下来。弟弟，哥保",fx:{risk:18,con:8,heart:-14},set:{xuezhan:true},note:"风险 +18 人脉 +8",next:"c3_4"},
  {t:"连夜送启盛去自首。大义灭亲，哥陪你一起担",fx:{heart:14,rep:-8,risk:-10},set:{dayi:true},note:"初心 +14 风险 -10",next:"c3_4"},
  {t:"花大钱送他出国，永远别回来",fx:{money:-2000000,risk:8,heart:-6},set:{chuguo:true},note:"资金 -200万",next:"c3_4"},
  {t:"在审讯室外陪他坐了一整夜，一句话不说",req:{aff:"sheng",min:70},fx:{heart:8,affSheng:8},note:"初心 +8",next:"c3_4"}],
 cardOpts:{yiyi:{t:"按兵不动，停工耗到莽村自己内讧",fx:{risk:-6,rep:2,heart:2},next:"c3_4"}}},
c3_4:{bg:"bg-rain",deco:"👮",
 lines:[
  ["me","深秋雨夜。旧厂街拆迁后的空地上，你看见一个白头发的男人站在路灯下——安欣。二十年，他把头发熬白了，人瘦得像一根警徽上的钢针。"],
  ["an","高启强。二十年前除夕，你在这儿卖鱼，我在值班室给你买过一份饺子。二十年，你从鱼摊走到了六十六层。我就想问问你——值吗？"],
  ["qin","他不是来抓我的。他是来接我回家的。可回哪个家？"]],
 choices:[
  {t:"『安欣，回头吧，你斗不赢整个京海。』",fx:{heart:-4,con:2,affAn:-2},note:"初心 -4",next:"c3_5"},
  {t:"『我们本可以做一辈子朋友。是我自己选了另一条路。』",fx:{heart:8,affAn:5},set:{liangzhi:true},note:"初心 +8",next:"c3_5"},
  {t:"把一份赵立冬的罪证线索，悄悄推到他脚边",req:{flag:"babing"},fx:{heart:12,risk:-6,affAn:6},set:{anxin_xiansuo:true},note:"初心 +12 风险 -6",next:"c3_5"},
  {t:"握住他的手：『安欣，如果我先伸手，你还接吗？』",req:{aff:"an",min:70},fx:{heart:10,affAn:8},set:{liangzhi:true},note:"初心 +10",next:"c3_5"}]},
c3_5:{bg:"bg-jinhan",deco:"🔪",
 lines:[
  ["me","地下车库。老默拉开车门坐进来，像每一次那样，先给丫丫的家教费报了账。然后他压低声音。"],
  ["mo","强哥。安欣的住址、巡逻班次，都摸清了。您一句话——今晚，吃鱼吗？"],
  ["qin","车里静得能听见心跳。老默的手，稳得像二十年前那个修车摊。"]],
 choices:[
  {t:"『老默，把名单烧了。安欣，不许动。』",fx:{heart:12,con:2},set:{baoanxin:true},note:"初心 +12",next:"c3_6"},
  {t:"沉默十秒，说：『按你的想法办。』",fx:{heart:-18,risk:14},set:{xuezhai2:true},note:"初心 -18 风险 +14",next:"c3_6"}]},
c3_6:{bg:"bg-tower",deco:"🎀",
 lines:[
  ["me","又是几年。大嫂走的那天，京海下了很大的雨。从那以后，陪你吃饭的人，只剩下瑶瑶。"],
  ["yao","爸。我整理了书房，发现一个上锁的抽屉……我没开。我只是想问，咱家的钱，都是干干净净的吗？"],
  ["qin","她眼里有大嫂的影子。她要是干净，就让她干净到底。"]],
 choices:[
  {t:"教她看报表、管账目——黄家的女儿，要接得住盘子",fx:{con:6,rep:4,affYao:5},note:"人脉 +6",next:"w3"},
  {t:"『瑶瑶，听话。这个抽屉，永远别打开。毕业后离开京海。』",fx:{heart:10,affYao:6},set:{yaogan:true},note:"初心 +10",next:"w3"},
  {t:"什么也不说，只是摸了摸她的头",fx:{heart:2,affYao:3},next:"w3"}]},
w3:{wave:"w3",next:"c3_chk"},
c3_chk:{hidden:true,route:s=>s.risk>=75?"g_net":"c4_1a",alt:["g_net","c4_1a"]},

/* ---------- 第四章 2021 · 潮水退去 ---------- */
c4_1a:{era:{y:"第 四 章 · 二 ○ 二 一",t:"潮水退去",s:"教育整顿驻点指导组进驻京海。潮水退去的时候，才知道谁在裸泳。",chap:4},next:"c4_1"},
c4_1:{bg:"bg-rain",deco:"📋",
 lines:[
  ["me","2021年。中央教育整顿驻点指导组进驻京海，组长徐忠。指导组的车子碾过雨水，停在强盛大厦楼下那天，整座城市都听见了。"],
  ["me","唐小龙被带走的那晚，强盛大厦的灯一盏一盏熄灭。京海的报纸用了一个词——『收网』。"]],
 choices:[
  {t:"紧急召开家族会议，商量对策",next:"c4_2"}]},
c4_2:{bg:"bg-rain",deco:"🎩",
 lines:[
  ["me","电视里，赵立冬戴着手铐走下警车。镜头扫过，他忽然朝镜头笑了笑——所有人都知道那个笑是什么意思。"],
  ["xz","高启强同志，指导组这里，有一份1996年到2021年的清单，越来越长。我们是来听你说的，不是来抓你——今天。"]],
 choices:[{t:"静观其变，等指导组先出牌",fx:{heart:1},next:"c4_3"}],
 cardOpts:{yuanjiao:{t:"抢先向指导组交出赵立冬的罪证，变被动为主动",fx:{risk:-10,heart:4},set:{tanzhu:true},next:"c4_3"}}},
c4_3:{bg:"bg-cell",deco:"🎀",
 lines:[
  ["me","深夜，书房。黄瑶坐在你对面，桌上摆着一个打开的抽屉，和一本泛黄的账本。"],
  ["yao","爸。账本我全看完了。白叔的事、徐江的事、启盛叔的事……我抱着它坐了一整夜。指导组的人说，你可以选。"],
  ["qin","我养大的姑娘，替我打开了最后一个抽屉。这一夜，谁都别想再骗自己了。"]],
 choices:[
  {t:"抢过账本，塞进壁炉。烧了它，烧了就干净了",fx:{heart:-16,risk:6,affYao:-8},set:{shaozhang:true},note:"初心 -16",next:"c4_4"},
  {t:"把账本推到她面前：『瑶瑶，交出去。这是爸最后能做的事。』",fx:{heart:16,affYao:8},set:{renzui:true},note:"初心 +16",next:"c4_4"},

e_newlife:{ending:{id:"newlife",name:"回 头 是 岸",text:"你选择了最难的那条路：交代一切，检举立功，把二十年的账一笔一笔还清。\n\n因为重大立功，判决书比所有人预想的仁慈。高墙内你学会了种菜、识字教书，给年轻犯人讲《孙子兵法》——只讲『慎战』那一章。\n\n安欣来看过你几次，每次都带一份猪肉白菜馅的饺子。他说：『高启强，你终于考上了你当年想考的那所学校——法律，是最后一课。』"},

e_chaos:{ending:{id:"chaos",name:"鱼 死 网 破",text:"你说你没输过。可这一夜，指导组的收网圈从楼下一层层合上来，像二十年前那张网住整条街的渔网。\n\n天台上，你最后看了一眼京海的灯火。安欣踩着水走上天台，喊的却是：『高启强！回头！』\n\n风浪越大，鱼越贵——可浪太大了，船是会翻的。你终究没能再赢一次。"},

e_run:{ending:{id:"run",name:"亡 命 南 洋",text:"渔船在公海上漂了十一天。你以为逃出了那张网，却发现自己从没离开过——护照是假的，钱是冻的，船老大接的，本来就是国际刑警的单子。\n\n引渡回国那天，舷梯下站着白头发的安欣。你笑了：『我就知道，会是你来接我。』\n\n后来狱里有人问你后不后悔。你说：跑了十一天才明白，海再大，也没有一寸是卖鱼人的退路。"},

g_rain:{ending:{id:"rain",name:"旧厂街的雨 夜",text:"风声太紧，你欠的债太多。一个再普通不过的雨夜，鱼池的水泵还在响，你却再也没能等到天亮收摊。\n\n菜市场第二天照常开门。人们叹一句『卖鱼的老高没了』，然后各自守着自己的一池鱼。\n\n在这个世界，你只是旧厂街一个没熬过风浪的鱼贩子。也许，这才是最干净的一种结局。"},
 fates:[["高启盛","把你的鱼摊守了三年，最终还是走了别的路"],["高启兰","医学院毕业，白大褂口袋里总装着一枚鱼钩"],["安欣","案卷上写着：被害人，高启强"]]},

  const names={tide:"潮退",peak:"京海之王·梦醒",newlife:"回头是岸",chaos:"鱼死网破",run:"亡命南洋",burn:"灰烬",rain:"旧厂街的雨夜",gunshot:"白金瀚的枪声",net:"提前收网"};
  $("gGrid").innerHTML=order.map(id=>{
   const sc=Object.values(S).find(s=>s.ending&&s.ending.id===id);
   const on=got[id];
   return '<div class="gslot '+(on?"on":"off")+'"><div class="gn">'+(on?names[id]:"？？？")+'</div><div class="gd">'+
    (on?sc.ending.text.split("\n")[0]:"尚未达成——换一条路走走看。")+'</div></div>';}).join("");
 }else if(gTab==="ach"){
  const got=achMap();
  $("aGrid").innerHTML=ACH.map(a=>{const on=got[a.id];
   return '<div class="ach '+(on?"on":"off")+'"><div class="an">'+(on?"🏆 ":"🔒 ")+a.n+'</div><div class="ad">'+a.d+'</div></div>';}).join("");
 }else{
  $("cardList").innerHTML=Object.keys(CARDS).map(k=>{const sv=st?st.cards[k]:undefined;
   const note=sv===true?"（持有）":sv===false?"（已打出）":"（未习得）";
   return '<div class="cardRow" style="opacity:'+(sv===true?"1":"0.45")+'"><span class="cn">🃏 '+CARDS[k].n+'</span><span class="cd">'+CARDS[k].d+note+'</span></div>';}).join("");
 }
 $("gallery").classList.add("show");
}
$("tabEnd").onclick=()=>showGallery("end");
$("tabAch").onclick=()=>showGallery("ach");
$("tabCard").onclick=()=>showGallery("card");

/* ================= V2 引擎：风浪回合 ================= */
let waveNext=null;
function hudCards(){if(!st)return;$("c_cards").innerHTML="🃏 <b>"+Object.keys(st.cards).filter(k=>st.cards[k]===true).length+"</b>";}
function startWave(id,next){
 st.wave={id:id,turn:0};waveNext=next;
 $("wEra").textContent=WAVES[id].era;$("wLog").textContent="";
 $("wave").classList.add("show");renderWave();saveGame();
}
function renderWave(){
 const W=WAVES[st.wave.id];
 $("wTurn").textContent="第 "+(st.wave.turn+1)+" / "+W.turns+" 回合";
 $("evBox").style.display="none";
 const box=$("wActs");box.innerHTML="";
 W.acts.forEach(id=>{const a=ACTIONS[id];const b=document.createElement("button");b.className="wAct";
  b.innerHTML=a.n(st,W)+'<span class="wd">'+a.d(st,W)+'</span>';
  b.onclick=()=>doAction(a);box.appendChild(b);});
}
function doAction(a){
 const W=WAVES[st.wave.id];const res=a.run(st,W);
 applyFx(res.fx);$("wLog").textContent=res.log||"";st.wave.turn++;
 if(Math.random()<0.45&&W.evs.length){showEvent(W.evs[Math.floor(Math.random()*W.evs.length)]);}
 else nextTurn();
 saveGame();
}
function showEvent(ev){
 beep(300,.15,"triangle",.05);
 const box=$("evBox");box.style.display="";box.innerHTML='<div class="et">⚡ '+ev.t+'</div><div class="ed">'+ev.d+'</div>';
 $("wActs").innerHTML="";
 const btns=document.createElement("div");btns.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
 if(ev.ch){ev.ch.forEach(c=>{const b=document.createElement("button");b.className="wAct";b.style.flex="1";
  b.innerHTML=c.t+'<span class="wd">'+fxNote(c.fx)+'</span>';
  b.onclick=()=>{applyFx(c.fx);box.style.display="none";$("wLog").textContent=c.t;nextTurn();};btns.appendChild(b);});}
 else{const b=document.createElement("button");b.className="wAct";b.textContent="知道了";b.style.flex="1";
  b.onclick=()=>{if(ev.fx)applyFx(ev.fx);box.style.display="none";nextTurn();};btns.appendChild(b);}
 box.appendChild(btns);
}
function nextTurn(){
 if(st.wave.turn>=WAVES[st.wave.id].turns){finishWave();return;}
 renderWave();saveGame();
}
function finishWave(){
 const nx=waveNext;st.wave=null;$("wave").classList.remove("show");
 checkAch();enter(nx);
}
$("wSkip").onclick=()=>{if(!st||!st.wave)return;
 st.wave.turn=WAVES[st.wave.id].turns;toast("你草草应付了经营——风浪不会等人");finishWave();};

/* ================= V2 引擎：成就 ================= */
const KEY_ACH="gq_ach";
function achMap(){try{return JSON.parse(LSget(KEY_ACH)||"{}")}catch(e){return{}}}
function checkAch(){
 if(!st)return;const got=achMap();
 ACH.forEach(a=>{if(got[a.id])return;let ok=false;try{ok=a.c(st)}catch(e){}
  if(ok){got[a.id]=1;LSset(KEY_ACH,JSON.stringify(got));
   st.achRun=(st.achRun||[]).concat(a.id);toast("🏆 成就解锁："+a.n);sfxBig();}});
}

/* ================= V2 引擎：好感 / 卡牌面板 ================= */
function openPanel(kind){
 const b=$("pBody");
 if(kind==="aff"){$("pTitle").textContent="人 物 好 感";
  b.innerHTML=Object.keys(AFF).map(id=>{const v=(st&&st.aff[id])||0;const A=AFF[id];
   return '<div class="affRow"><span class="av" style="border-color:'+A.c+'">'+A.e+'</span>'+
    '<span style="width:56px;flex:none">'+A.n+'</span>'+
    '<span class="bar"><i style="width:'+v+'%;background:'+A.c+'"></i></span>'+
    '<span class="st">'+v+' · '+affStatus(id,v)+'</span></div>';}).join("")+
   '<div style="font-size:11.5px;color:var(--dim);margin-top:10px">好感由剧情选择与风浪回合累积，影响部分隐藏选项与人物命运。</div>';}
 else{$("pTitle").textContent="谋 略 卡 ·《孙子兵法》";
  b.innerHTML=Object.keys(CARDS).map(k=>{const sv=st?st.cards[k]:undefined;
   const note=sv===true?"（持有 · 可于关键剧情打出）":sv===false?"（已打出）":"（尚未习得 · 风浪回合研读可得）";
   return '<div class="cardRow" style="opacity:'+(sv===true?"1":"0.45")+'"><span class="cn">🃏 '+CARDS[k].n+'</span><span class="cd">'+CARDS[k].d+note+'</span></div>';}).join("");}
 $("panel").classList.add("show");saveGame();
}
$("c_aff").onclick=()=>{if(st)openPanel("aff");};
$("c_cards").onclick=()=>{if(st)openPanel("cards");};
$("pClose").onclick=()=>$("panel").classList.remove("show");

/* ================= 存档 / 流程 ================= */
function saveGame(){st.node=curId;LSset(KEY_SAVE,JSON.stringify(st));}
function startNew(){st=fresh();st.chap=1;$("title").classList.remove("show");$("ending").classList.remove("show");$("wave").classList.remove("show");$("panel").classList.remove("show");enter("c1_1");}
function cont(){try{const s0=JSON.parse(LSget(KEY_SAVE));const f=fresh();
 f.set=Object.assign(f.set,s0.set||{});f.aff=Object.assign(f.aff,s0.aff||{});f.cards=Object.assign(f.cards,s0.cards||{});
 st=Object.assign(f,s0);st.node=s0.node||"c1_1";
 $("title").classList.remove("show");enter(st.node);}catch(e){startNew();}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800);}
$("btnNew").onclick=startNew;
$("btnCont").onclick=cont;
$("btnGal").onclick=showGallery;
$("btnGal2").onclick=showGallery;
$("btnGalBack").onclick=()=>{$("gallery").classList.remove("show");if(!st)$("title").classList.add("show");};
$("btnAgain").onclick=()=>{$("ending").classList.remove("show");startNew();};
$("btnHome").onclick=()=>{$("ending").classList.remove("show");st=null;$("title").classList.add("show");};
 if(LSget(KEY_SAVE))$("btnCont").style.display="";

/* ================= 自检 ================= */
window.__qa=function(n){
 n=n||300;const errs=[];let ends=0;
 // 静态：next 引用与 alt 枚举
 for(const id in S){const s=S[id];
  if(typeof showEra!=="function")errs.push("showEra 函数缺失");
  if(s.era&&!s.next)errs.push(id+" era 缺少 next");
  if(s.wave&&!WAVES[s.wave])errs.push(id+" 未知风浪 "+s.wave);
  if(s.cardOpts)for(const k in s.cardOpts){if(!CARDS[k])errs.push(id+" 未知卡牌 "+k);
   const c=s.cardOpts[k];if(c.next&&!S[c.next])errs.push(id+" 卡牌选项缺失 "+c.next);}
  if(s.next&&typeof s.next!=="function"&&!S[s.next])errs.push(id+" -> 缺失节点 "+s.next);
  if(s.alt)s.alt.forEach(a=>{if(!S[a])errs.push(id+" alt 缺失 "+a)});
  if(s.choices)s.choices.forEach((c,i)=>{if(c.next&&typeof c.next!=="function"&&!S[c.next])errs.push(id+" 选择"+i+" 缺失 "+c.next)});
  if(!s.lines&&!s.choices&&!s.ending&&!s.hidden&&!s.era&&!s.wave)errs.push(id+" 空节点");}
 // 动态：随机通关
 for(let t=0;t<n;t++){const s0=fresh();let node="c1_1",steps=0;
  try{while(steps++<300){const sc=S[node];
   if(!sc){errs.push("运行期缺失节点 "+node);break;}
   if(sc.ending){ends++;break;}
   if(sc.hidden){node=sc.route(s0);continue;}
   if(sc.wave){const W=WAVES[sc.wave];let t=0;
    while(t++<W.turns){const a=ACTIONS[W.acts[Math.floor(Math.random()*W.acts.length)]];
     const r=a.run(s0,W);applyFx2(s0,r.fx);
     if(Math.random()<0.45&&W.evs.length){const ev=W.evs[Math.floor(Math.random()*W.evs.length)];
      if(ev.fx)applyFx2(s0,ev.fx);
      if(ev.ch)applyFx2(s0,ev.ch[Math.floor(Math.random()*ev.ch.length)].fx);}}
    node=sc.next;continue;}
   if(sc.choices){const ok=sc.choices.filter(c=>reqOk(c));const pick=ok[Math.floor(Math.random()*ok.length)]||sc.choices[0];
    applyFx2(s0,pick.fx);if(pick.set)Object.assign(s0.set,pick.set);node=pick.route?pick.route(s0):pick.next;continue;}
   let nx=sc.next;if(typeof nx==="function")nx=nx(s0);node=nx;}}catch(e){errs.push("异常:"+e.message+" @"+node)}
 }
 return JSON.stringify({errs:errs.slice(0,20),errCount:errs.length,endingsReached:ends,runs:n});
};
function applyFx2(s,fx){if(!fx)return;for(const k in fx){const v=fx[k];if(!v)continue;
 if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(s.aff[id]!==undefined)s.aff[id]=clamp(s.aff[id]+v);continue;}
 if(k==="money")s.money=Math.max(0,s.money+v);else s[k]=clamp(s[k]+v);}}
window.__goto=function(id){st=st||fresh();$("title").classList.remove("show");enter(id);};
window.__st=()=>st;
</script>
