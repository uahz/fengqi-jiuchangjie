<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#131313"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>风起旧厂街 · 高启强 | 对话式剧情游戏</title>
<style>/* ================= 风起旧厂街 · Android 版（Luma 深色风格） ================= */
:root{
  --bg:#101010; --card:#1f1f1f; --card2:#2b2b2b; --line:#303030; --ink:#f5f5f5;
  --dim:#9c9c9c; --dim2:#6d6d6d; --gold:#e8c07a; --green:#8fce8f; --red:#e07a6a;
  --ui:-apple-system,"SF Pro Text","SF Pro Display",Roboto,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:var(--ui);cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 背景舞台 ---------- */
#stage{position:absolute;inset:0;transition:opacity .6s}
#bg{position:absolute;inset:0;transition:background 1s}
#deco{position:absolute;right:6%;top:10%;font-size:110px;opacity:.06;filter:grayscale(60%);pointer-events:none}
#fog{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 115%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);pointer-events:none}
.bg-market{background:radial-gradient(ellipse at 75% -10%,rgba(232,165,90,.10),transparent 55%),linear-gradient(180deg,#171510 0%,#101010 70%)}
.bg-station{background:radial-gradient(ellipse at 20% -10%,rgba(90,140,200,.10),transparent 55%),linear-gradient(180deg,#0f1418 0%,#101010 70%)}
.bg-jinhan{background:radial-gradient(ellipse at 50% -10%,rgba(220,95,80,.12),transparent 55%),linear-gradient(180deg,#180f10 0%,#101010 70%)}
.bg-tower{background:radial-gradient(ellipse at 80% 100%,rgba(200,175,95,.08),transparent 55%),linear-gradient(180deg,#101318 0%,#101010 70%)}
.bg-rain{background:radial-gradient(ellipse at 50% -10%,rgba(120,140,170,.09),transparent 55%),linear-gradient(180deg,#0f1216 0%,#0e0e0e 70%)}
.bg-cell{background:linear-gradient(180deg,#151515 0%,#0e0e0e 100%)}
.bg-dawn{background:radial-gradient(ellipse at 50% 110%,rgba(240,170,90,.14),transparent 60%),linear-gradient(180deg,#171510 0%,#101010 70%)}

/* ---------- 顶部状态栏 ---------- */
#hud{position:relative;z-index:5;display:none;flex-wrap:nowrap;overflow-x:auto;gap:6px;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  background:linear-gradient(180deg,rgba(16,16,16,.97),rgba(16,16,16,.8));backdrop-filter:blur(10px);scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
#chTag{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:1px;margin-right:4px;white-space:nowrap}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 11px;border:none;border-radius:999px;
  background:var(--card);color:var(--dim);white-space:nowrap;flex:none;position:relative}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip.warn{background:rgba(224,122,106,.15);color:#f0a99d;animation:pulse 1.4s infinite}
.chip.btn{cursor:pointer}
#sndBtn{flex:none;margin-left:auto;background:var(--card);border:none;color:var(--dim);border-radius:999px;padding:6px 12px;font-size:12.5px}
.flo{position:absolute;right:6px;top:-4px;font-size:11px;font-weight:700;pointer-events:none;animation:flo 1.1s forwards}
.flo.up{color:var(--green)}.flo.dn{color:var(--red)}
@keyframes flo{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-14px)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(224,122,106,.16)}}

/* ---------- 底部悬浮导航（Luma） ---------- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:40;display:none;gap:2px;background:rgba(40,40,40,.88);backdrop-filter:blur(18px);
  border-radius:999px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;
  color:var(--dim);font-size:11px;padding:7px 24px;border-radius:999px;transition:background .2s}
.navbtn:active{background:#3d3d3d}
.navbtn .ni{font-size:19px;line-height:1.2}

/* ---------- 对话区 ---------- */
#bottom{position:relative;z-index:5;margin-top:auto;padding:10px 14px calc(88px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:10px}
#dlg{width:100%;max-width:520px;background:var(--card);border-radius:24px;padding:18px 18px 30px;min-height:120px;
  position:relative;box-shadow:0 12px 44px rgba(0,0,0,.45)}
#who{position:absolute;top:-14px;left:16px;display:inline-flex;align-items:center;gap:7px;background:#2c2c2c;
  border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;font-weight:600;letter-spacing:.5px}
#who .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#383838;border:1px solid #464646}
#txt{font-size:16.5px;line-height:1.85;color:var(--ink);min-height:66px;white-space:pre-wrap}
#hint{position:absolute;right:16px;bottom:10px;font-size:11px;color:var(--dim2);opacity:.85;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}

#choices{width:100%;max-width:520px;display:flex;flex-direction:column;gap:9px}
.choice{position:relative;text-align:left;background:var(--card);border:none;border-radius:20px;color:var(--ink);
  font-size:15px;font-weight:500;padding:14px 16px 13px 50px;line-height:1.55;min-height:52px;
  transition:transform .15s,background .15s}
.choice::before{content:"";position:absolute;left:17px;top:16px;width:18px;height:18px;border-radius:50%;border:2px solid #4a4a4a}
.choice:active{transform:scale(.98);background:var(--card2)}
.choice .fx{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-weight:400}
.choice.lock{opacity:.4}
.choice.lock::before{content:"🔒";border:none;width:auto;height:auto;font-size:12px;left:15px;top:16px}
.choice.cardOpt{background:#262118}
.choice.cardOpt::before{content:"🃏";border:none;width:auto;height:auto;font-size:15px;left:15px;top:14px}

/* ---------- 覆盖层 ---------- */
.ovl{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:24px;overflow:auto}
.ovl.show{display:flex}
#era,#title,#ending,#gallery{background:rgba(12,12,12,.985)}
#wave,#panel{background:rgba(12,12,12,.92);backdrop-filter:blur(10px)}

#era .y{font-size:12px;letter-spacing:6px;color:var(--dim);margin-bottom:14px}
#era .t{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--ink)}
#era .s{margin-top:16px;color:var(--dim);font-size:14px;line-height:1.9;max-width:340px}
#era .go{margin-top:42px;background:var(--ink);color:#111;border:none;border-radius:999px;
  padding:14px 46px;font-size:15px;font-weight:700;transition:transform .15s}
#era .go:active{transform:scale(.97)}

#title{background:radial-gradient(ellipse at 50% 28%,#1e1e1e,#101010 72%)}
#title .fish{font-size:58px;margin-bottom:12px;filter:drop-shadow(0 0 34px rgba(255,255,255,.28))}
#title h1{font-size:42px;font-weight:800;letter-spacing:8px;color:var(--ink)}
#title .sub{margin-top:10px;color:var(--dim);letter-spacing:4px;font-size:13px;font-weight:600}
#title .desc{margin-top:14px;color:var(--dim);font-size:13px;line-height:2;max-width:340px}
#title .btns{margin-top:32px;display:flex;flex-direction:column;gap:10px;width:min(320px,84vw)}
.mbtn{background:var(--card);border:none;color:var(--ink);border-radius:999px;padding:14px 20px;
  font-size:15px;font-weight:600;letter-spacing:2px;transition:transform .15s}
.mbtn.pri{background:var(--ink);color:#111}
.mbtn:active{transform:scale(.97)}

/* ---------- 结局 ---------- */
#endCard{position:relative;width:100%;max-width:430px;background:var(--card);border-radius:24px;
  padding:26px 24px 22px;text-align:left;box-shadow:0 24px 70px rgba(0,0,0,.55)}
#endCard .tag{color:var(--dim2);letter-spacing:3px;font-size:11px}
#endName{font-size:29px;font-weight:800;letter-spacing:4px;margin:8px 0 4px;color:var(--gold)}
#endGrade{position:absolute;right:22px;top:22px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  font-size:27px;font-weight:800;border:3px solid var(--gold);color:var(--gold)}
#endText{font-size:14px;line-height:1.9;color:#d9d9d9;margin:12px 0 14px;white-space:pre-wrap}
#fates{border-top:1px solid #2c2c2c;padding-top:12px;display:grid;gap:5px;font-size:12.5px;color:var(--dim)}
#fates b{color:var(--ink);margin-right:8px;font-weight:600}
#endStats{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
#endStats span{background:#2a2a2a;border-radius:999px;padding:4px 10px;color:var(--dim)}
#endBtns{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
#endBtns .mbtn{padding:12px 16px;font-size:13.5px;flex:1;letter-spacing:1px}

/* ---------- 图鉴 / 面板 ---------- */
#gallery h2{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--ink);margin-bottom:14px}
#gGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.gslot{border-radius:18px;padding:14px;text-align:left;background:var(--card)}
.gslot.on{background:#252015}
.gslot .gn{font-size:15px;font-weight:700;color:var(--ink)}
.gslot.on .gn{color:var(--gold)}
.gslot .gd{margin-top:5px;font-size:11.5px;color:var(--dim);line-height:1.65}
.gslot.off{opacity:.45}

.panelCard{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:20px;max-height:84vh;overflow:auto;text-align:left}
.pTitle{font-size:18px;font-weight:800;letter-spacing:4px;color:var(--ink);margin-bottom:10px}
.affRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #272727;font-size:13px}
.affRow .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#2c2c2c;font-size:14px;flex:none}
.affRow .bar{flex:1;height:6px;border-radius:99px;background:#2c2c2c;overflow:hidden}
.affRow .bar i{display:block;height:100%;border-radius:99px}
.affRow .st{width:132px;font-size:10.5px;color:var(--dim);text-align:right;flex:none}
.cardRow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #272727;font-size:12.5px;align-items:flex-start}
.cardRow .cn{color:var(--gold);font-weight:700;flex:none}
.cardRow .cd{color:var(--dim);line-height:1.7}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:var(--card);border:none;color:var(--dim);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600}
.tabs button.on{background:var(--ink);color:#111}
.achGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:440px}
.ach{border-radius:16px;padding:12px;text-align:left;background:var(--card)}
.ach.on{background:#252015}
.ach .an{font-size:13px;font-weight:700;color:var(--ink)}
.ach.on .an{color:var(--gold)}
.ach .ad{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.6}
.ach.off{opacity:.45}

/* ---------- 风浪回合 ---------- */
.waveCard{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:22px 20px 16px;
  text-align:left;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.wEra{color:var(--dim2);letter-spacing:2px;font-size:11px}
.wTitle{font-size:24px;font-weight:800;letter-spacing:5px;color:var(--ink);margin:6px 0 2px}
.wTurn{font-size:12.5px;color:var(--dim);margin-bottom:4px}
.wHint{font-size:12px;color:var(--dim2);margin-bottom:12px}
.wActs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wAct{background:#2a2a2a;border:none;border-radius:16px;color:var(--ink);padding:12px;text-align:left;
  font-size:13.5px;font-weight:600;transition:transform .15s}
.wAct:active{transform:scale(.97)}
.wAct .wd{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-weight:400}
.wLog{margin-top:10px;font-size:12.5px;color:var(--green);min-height:16px;line-height:1.7;white-space:pre-wrap}
#evBox{margin:8px 0 2px;border-radius:16px;padding:12px;background:#26200f0d}
#evBox .et{color:var(--gold);font-size:14.5px;font-weight:700;margin-bottom:5px}
#evBox .ed{font-size:12.5px;line-height:1.75;color:#d9d9d9;margin-bottom:10px}
.wSkip{margin-top:12px;background:none;border:1px solid #333;color:var(--dim2);border-radius:999px;padding:7px 16px;font-size:11.5px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
  background:#272727;color:var(--gold);border-radius:999px;padding:9px 20px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1}

@media (min-width:720px){
  #bottom{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="bg" class="bg-market"></div><div id="deco">🐟</div><div id="fog"></div></div>
  <div id="hud">
    <span id="chTag">序章</span>
    <span class="chip" id="c_money">💰 资金 <b>0</b></span>
    <span class="chip" id="c_rep">🐟 声望 <b>0</b></span>
    <span class="chip" id="c_con">🤝 人脉 <b>0</b></span>
    <span class="chip" id="c_risk">⚠️ 风险 <b>0</b></span>
    <span class="chip" id="c_heart">❤️ 初心 <b>0</b></span>
    <span class="chip btn" id="c_cards" title="谋略卡">🃏 <b>0</b></span>
    <span class="chip btn" id="c_aff" title="人物好感">👥 好感</span>
    <span class="chip" id="c_flag" style="display:none"></span>
    <button id="sndBtn" title="音效开关">🔊 音效</button>
  </div>
  <div id="bottom">
    <div id="choices"></div>
    <div id="dlg"><div id="who"><span class="av" id="whoAv">🐟</span><span id="whoName">高启强</span></div>
      <div id="txt"></div><div id="hint">点击继续 ▸</div></div>
  </div>
</div>

<div id="era" class="ovl"><div class="y" id="eraY"></div><div class="t" id="eraT"></div><div class="s" id="eraS"></div><button class="go" id="eraGo">进 入 故 事</button></div>

<div id="wave" class="ovl"><div class="waveCard">
  <div class="wEra" id="wEra"></div>
  <div class="wTitle">风 浪 回 合</div>
  <div class="wTurn" id="wTurn"></div>
  <div class="wHint">一个时代不是一天过的。每回合做一件事，风浪会随时降临。</div>
  <div id="evBox" style="display:none"></div>
  <div id="wActs" class="wActs"></div>
  <div class="wLog" id="wLog"></div>
  <button class="wSkip" id="wSkip">草草应付，直接翻篇 →</button>
</div></div>

<div id="panel" class="ovl"><div class="panelCard"><div class="pTitle" id="pTitle"></div><div id="pBody"></div>
  <button class="mbtn" id="pClose" style="margin-top:18px">关 闭</button></div></div>

<div id="title" class="ovl show">
  <div class="fish">🐟</div>
  <h1>风起旧厂街</h1>
  <div class="sub">高启强 · 对话式剧情游戏</div>
  <div class="desc">2000年，京海市，旧厂街菜市场。<br>你还是一个每天凌晨三点起来进鱼的鱼贩子。<br>风浪很大。这一次，每一步怎么走，由你决定。</div>
  <div class="btns">
    <button class="mbtn pri" id="btnNew">开 始 游 戏</button>
    <button class="mbtn" id="btnCont" style="display:none">继 续 上 局</button>
    <button class="mbtn" id="btnGal">结 局 图 鉴</button>
  </div>
</div>

<div id="ending" class="ovl">
  <div id="endCard">
    <div class="tag">—— 结 局 ——</div>
    <div id="endName"></div><div id="endGrade"></div>
    <div id="endText"></div>
    <div id="fates"></div>
    <div id="endStats"></div>
    <div id="endBtns">
      <button class="mbtn pri" id="btnAgain">重 走 一 次</button>
      <button class="mbtn" id="btnGal2">结 局 图 鉴</button>
      <button class="mbtn" id="btnHome">回 到 标 题</button>
    </div>
  </div>
</div>

<div id="gallery" class="ovl"><h2 id="gTitle" style="font-family:var(--serif);letter-spacing:8px;font-size:30px;color:var(--gold);margin-bottom:14px">结 局 图 鉴</h2>
  <div class="tabs"><button id="tabEnd" class="on">结 局</button><button id="tabAch">成 就</button><button id="tabCard">谋 略</button></div>
  <div id="gGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:min(860px,100%)"></div>
  <div id="achWrap" style="display:none;width:min(760px,100%)"><div class="achGrid" id="aGrid"></div></div>
  <div id="cardWrap" style="display:none;width:min(560px,100%)"><div id="cardList"></div></div>
  <button class="mbtn" id="btnGalBack" style="margin-top:26px">返 回</button></div>

<div id="toast"></div>

<script>
"use strict";
/* ================= 人物表 ================= */
const C={
  qiang:{n:"高启强",e:"🐟",c:"#e5484d"},
  qin:{n:"高启强",e:"💭",c:"#c084fc"},

  sao:{n:"陈书婷",e:"🌹",c:"#f5c518"},
  mo:{n:"老默",e:"🔪",c:"#8a93a6"},
  xu:{n:"徐江",e:"🐺",c:"#ff7a1a"},
  tai:{n:"陈泰",e:"🐉",c:"#c0a16b"},
  xl:{n:"唐小龙",e:"🚬",c:"#6fbf73"},
  xh:{n:"唐小虎",e:"🚬",c:"#79c77d"},
  zhao:{n:"赵立冬",e:"🎩",c:"#9aa5b1"},
  yao:{n:"黄瑶",e:"🎀",c:"#ff9ecb"},
  xz:{n:"徐忠",e:"📋",c:"#4dd0c4"},
  me:{n:"旁白",e:"🎬",c:"#7f8ea3"}
};

/* ================= V2：谋略卡 / 好感 / 成就 / 风浪回合 ================= */
const CARDS={
 mantian:{n:"瞒天过海",d:"示假隐真，把锋芒藏进沉默里。"},
 jiedao:{n:"借刀杀人",d:"不必亲往，自有急着想上位的人。"},
 fanke:{n:"反客为主",d:"跪下去的是徒弟，站起来的是对手。"},
 jinchani:{n:"金蝉脱壳",d:"把真正的东西，留在壳的外面。"},
 yiyi:{n:"以逸待劳",d:"先让子弹飞一会儿，耗到对手自乱阵脚。"},
 yuanjiao:{n:"远交近攻",d:"把最远的那只手，变成自己的手。"}
};
const cap=id=>id[0].toUpperCase()+id.slice(1);
const AFF={
 an:{n:"安欣",e:"👮",c:"#4d9fff"},
 sheng:{n:"高启盛",e:"🕶️",c:"#a06bff"},
 lan:{n:"高启兰",e:"🩺",c:"#6fd3c7"},
 sao:{n:"陈书婷",e:"🌹",c:"#f5c518"},
 mo:{n:"老默",e:"🔪",c:"#8a93a6"},
 yao:{n:"黄瑶",e:"🎀",c:"#ff9ecb"}
};
function affStatus(id,v){
 const m={

 lines:[
  ["me","2000年，京海市，旧厂街菜市场。凌晨三点的白炽灯下，鱼池的水汽混着腥味，漫过整条街。"],

  ["qin","爹妈走得早。那年我十三岁，一手拉扯着弟弟启盛、妹妹启兰。这条鱼摊，就是全家的命。"],

c1_3:{bg:"bg-station",deco:"🚨",

c1_4:{bg:"bg-station",deco:"👮",
 lines:[

c1_7:{bg:"bg-rain",deco:"🌩️",

  ["qiang","我离他只有三步。伸手，拉他，配电箱就在我手边，我能断电的。可我僵在那儿，腿像灌了铅。"],
  ["xl","高老板，今晚谁都没来过市场。听见没有？谁、都、没、来、过。徐家找不着人，你我都干净。"],

 choices:[

 lines:[
  ["me","六年，弹指一挥。旧厂街的鱼摊变成了水产档口，你的名字在京海的水产圈里有了分量。这一年，两个女人一个男人，先后走进你的命里。"],
  ["sao","高老板，坐。听说徐江的人为难你？我是陈书婷，白家的当家人。京海地面上的事，轮不到他一个人说了算。"]],next:"c2_2"},
c2_2:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","我这人不喜欢绕弯子。白金瀚、白家的场子，缺一个能压得住场面的人。你敢不敢接？"],
  ["qin","她递过来的不是酒杯，是一把椅子。接，还是不接。"]],next:"c2_2b"},
c2_2b:{bg:"bg-market",deco:"🔪",
 lines:[
  ["me","菜场西口，一个刚出狱的男人守着个修车摊，被人掀了摊子也不还手。你认得他——老默，当年进去了几年，出来老婆没了，就剩一个闺女。"],
  ["mo","高老板。不用可怜我。我就是……想给丫丫挣个学费。"],
  ["qin","这人眼里有一种东西，像深海里的鱼，不出声，但知道往哪儿游。"]],
 choices:[
  {t:"『西口那个摊位归你。往后你跟我，我养你们父女。』",fx:{heart:6,con:5,affMo:8},set:{laomo:true},note:"初心 +6 人脉 +5",next:"c2_3"},
  {t:"雇他看场子，但钱按行价再压三成——便宜好用",fx:{con:6,heart:-4,affMo:4},set:{laomo:true},note:"人脉 +6",next:"c2_3"},
  {t:"点头致意，各过各的日子",fx:{heart:2,affMo:1},note:"初心 +2",next:"c2_3"}]},
c2_3:{bg:"bg-jinhan",deco:"🐺",
 lines:[
  ["me","徐江的时代到头了。线人反水、账本外流、白金瀚的股东连夜撤资，他成了京海人人都想踩一脚的落水狗。今夜，他孤身来见你。"],
  ["xu","高启强！成王败寇，我认。但京海这么大，你就不怕我姓徐的哪天缓过来，再跟你算今天的账？"],
  ["qin","他身后已经没有兄弟了。可饿狼就是饿狼。"]],
 choices:[
  {t:"递给老默一根烟：『告诉老默，我想吃鱼了。』",req:{flag:"laomo"},fx:{rep:12,risk:14,heart:-10},set:{xuezhai1:true},note:"声望 +12 风险 +14",next:"c2_4"},
  {t:"连夜把他和账目一起送到安欣手里，交由法律发落",fx:{heart:10,risk:-8,rep:6},note:"初心 +10 风险 -8",next:"c2_4"},
  {t:"放他离开京海：『我高启强不斩落水狗。』",fx:{rep:-4,risk:8,heart:2},set:{fanghu:true},note:"风险 +8",next:"c2_4"}],
 cardOpts:{jiedao:{t:"把徐江仇家的名单，递给急着上位的人",fx:{rep:10,con:4,heart:-8,risk:4},next:"c2_4"}}},
c2_4:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","泰叔的寿宴。满堂宾客里，老爷子招手让你过去，把一根不离手的枣木拐杖放在你面前。"],
  ["tai","启强啊。这根拐杖，我拄了三十年，京海没人敢扶。今天你扶一下试试？"],
  ["qin","满场的人都盯着。这一扶，就是他陈泰的人了。"]],next:"c2_5"},
c2_5:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["qin","扶，还是不扶。"]],
 choices:[
  {t:"双膝跪地，端茶认干爹：『爹在上，受儿子一拜。』",fx:{con:12,rep:6,heart:-8},set:{taishu:true},note:"人脉 +12 声望 +6",next:"c2_5b"},
  {t:"不跪。双手抱拳，只把拐杖扶正放好：『叔，我敬您，但跪不下去。』",fx:{rep:10,con:4},set:{yinggutou:true},note:"声望 +10",next:"c2_5b"}],
 cardOpts:{fanke:{t:"不跪也不接——反手把白金瀚三成干股的协议推到泰叔面前",fx:{rep:14,con:8,heart:-2},set:{pingdeng:true},next:"c2_5b"}}},
c2_5b:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","高启强，跟着你这几年，我看得明白：你这个人，心里有一杆秤。我的场子，我这个人，你敢不敢一起接？"],
  ["qin","大嫂笑了。京海谁不知道，能得到陈书婷一句『敢』，半个白金瀚就姓了高。"]],
 choices:[
  {t:"『娶。这辈子，高启强明媒正娶。』",fx:{rep:8,heart:4,affSao:8},set:{marry:true},note:"声望 +8",next:"c2_6"},
  {t:"『书婷，我现在满手是泥，配不上你。等我洗干净……』",fx:{rep:-6,heart:6,affSao:3},note:"初心 +6",next:"c2_6"}]},
c2_6:{bg:"bg-tower",deco:"🕶️",
 lines:[
  ["me","这一年，启盛的小灵通柜台开进了三家商场。他站在柜台后面给人家讲『信号增强专利』，眼睛亮得吓人。"],
  ["sheng","哥，柜台叫什么名字，我想好了——就叫『强盛』。强的强，盛的盛。咱高家，从此往上走！"],
  ["qin","强盛。鱼摊的名字跟着我们二十年了，从今天起，它有了新的意思。"]],
 choices:[
  {t:"把全部积蓄押进去，兄弟俩合伙干",fx:{money:-20000,rep:8,con:6,affSheng:4},set:{qiangsheng:true},note:"资金 -20000 声望 +8",next:"c2_7"},
  {t:"只出面子不出钱：『哥给你站台，账你自己管。』",fx:{rep:4,con:3,affSheng:3},set:{qiangsheng:true},note:"声望 +4",next:"c2_7"},
  {t:"劝他收手：『小灵通火不了几年，安安稳稳比什么都强。』",fx:{heart:6,rep:-4,affSheng:2},note:"初心 +6",next:"c2_7"}]},
c2_7:{bg:"bg-jinhan",deco:"🌃",
 lines:[
  ["me","2006年冬天，『强盛商贸有限公司』挂牌。鞭炮屑落满门口，像一场红色的雪。"],
  ["me","泰叔老了，白金瀚的钥匙一点点挪进你口袋。京海的人提起高启强，不再说『卖鱼的』，而是压低声音说——『强哥』。"]],
 choices:[
  {t:"接下他递来的烟，陪他在天台看一夜的京海",fx:{rep:4,con:4,risk:4},note:"声望 +4 人脉 +4",next:"c2_chk"},
  {t:"把烟掐了：『叔，烟伤肺。咱们讲生意。』",fx:{rep:6,heart:2},note:"声望 +6",next:"c2_chk"}]},
c2_chk:{hidden:true,route:s=>s.risk>=75?"g_gun":"w2",alt:["g_gun","w2"]},
w2:{wave:"w2",next:"c3_1a"},

/* ---------- 第三章 2015 · 京海之巅 ---------- */
c3_1a:{era:{y:"第 三 章 · 二 ○ 一 五",t:"京海之巅",s:"强盛大厦六十六层，整面落地窗外，就是整个京海。",chap:3},next:"c3_1"},
c3_1:{bg:"bg-tower",deco:"🏙️",
 lines:[
  ["me","2015年。强盛集团总部大楼落成，66层，京海第三高楼。剪彩那天的红绸，比当年鱼摊的塑料袋贵一万倍。"],
  ["me","地产、商贸、娱乐、物流——集团的版图铺满京海。你站在顶层落地窗前，脚下是车流，是灯火，是你从鱼摊一步一步走上来的这座城。"],
  ["qin","风浪越大，鱼越贵。这句话，我用了十五年。"]],next:"c3_2"},
c3_2:{bg:"bg-tower",deco:"🎩",
 lines:[
  ["me","深夜，一辆黑色轿车停进地下车库。市委常委、政法委书记赵立冬的秘书递来一份文件。"],
  ["zhao","高总，强盛能长这么大，靠什么，你心里有数吧。市里项目要做优做大，你这两成干股，就是投名状。往后你的事，就是我的事。"],
  ["qin","官帽比黑金可怕，也比黑金好使。可这东西一旦接了，就再没有回头路。"]],
 choices:[
  {t:"签字，递干股。这把伞，不要白不要",fx:{con:12,risk:18,heart:-12},set:{sanhu:true},note:"人脉 +12 风险 +18",next:"c3_3"},
  {t:"虚与委蛇：『赵书记，容我先做做股东们的思想工作。』",fx:{con:4,risk:8},note:"风险 +8",next:"c3_3"},
  {t:"当场拒绝，顺手把录音笔留在了茶几上",fx:{risk:20,heart:6},set:{babing:true},note:"风险 +20 初心 +6",next:"c3_3"}],
 cardOpts:{jinchani:{t:"假意应承，把干股挂进三家空壳公司里",fx:{con:6,risk:4},next:"c3_3"}}},
c3_3:{bg:"bg-rain",deco:"🌩️",
 lines:[
  ["me","莽村的旧厂改造，村民堵了强盛的工地三个月。谈判那天，李宏伟带着人掀了桌，泼了启盛一身茶。"],
  ["me","三天后，李宏伟被发现死在冷库，凶器——是一条冻鱼。启盛坐在审讯室里，眼镜碎了，笑得很平静。"],
  ["sheng","哥，我替你把脏活干了。你说过，风浪越大，鱼越贵。"],
  ["qin","我什么时候让你去杀人了！……启盛是我弟弟。这一步怎么落，落下去就再也收不回来。"]],
 choices:[
  {t:"动用一切关系把案子压下来。弟弟，哥保",fx:{risk:18,con:8,heart:-14},set:{xuezhan:true},note:"风险 +18 人脉 +8",next:"c3_4"},
  {t:"连夜送启盛去自首。大义灭亲，哥陪你一起担",fx:{heart:14,rep:-8,risk:-10},set:{dayi:true},note:"初心 +14 风险 -10",next:"c3_4"},
  {t:"花大钱送他出国，永远别回来",fx:{money:-2000000,risk:8,heart:-6},set:{chuguo:true},note:"资金 -200万",next:"c3_4"},
  {t:"在审讯室外陪他坐了一整夜，一句话不说",req:{aff:"sheng",min:70},fx:{heart:8,affSheng:8},note:"初心 +8",next:"c3_4"}],
 cardOpts:{yiyi:{t:"按兵不动，停工耗到莽村自己内讧",fx:{risk:-6,rep:2,heart:2},next:"c3_4"}}},
c3_4:{bg:"bg-rain",deco:"👮",
 lines:[
  ["me","深秋雨夜。旧厂街拆迁后的空地上，你看见一个白头发的男人站在路灯下——安欣。二十年，他把头发熬白了，人瘦得像一根警徽上的钢针。"],
  ["an","高启强。二十年前除夕，你在这儿卖鱼，我在值班室给你买过一份饺子。二十年，你从鱼摊走到了六十六层。我就想问问你——值吗？"],
  ["qin","他不是来抓我的。他是来接我回家的。可回哪个家？"]],
 choices:[
  {t:"『安欣，回头吧，你斗不赢整个京海。』",fx:{heart:-4,con:2,affAn:-2},note:"初心 -4",next:"c3_5"},
  {t:"『我们本可以做一辈子朋友。是我自己选了另一条路。』",fx:{heart:8,affAn:5},set:{liangzhi:true},note:"初心 +8",next:"c3_5"},
  {t:"把一份赵立冬的罪证线索，悄悄推到他脚边",req:{flag:"babing"},fx:{heart:12,risk:-6,affAn:6},set:{anxin_xiansuo:true},note:"初心 +12 风险 -6",next:"c3_5"},
  {t:"握住他的手：『安欣，如果我先伸手，你还接吗？』",req:{aff:"an",min:70},fx:{heart:10,affAn:8},set:{liangzhi:true},note:"初心 +10",next:"c3_5"}]},
c3_5:{bg:"bg-jinhan",deco:"🔪",
 lines:[
  ["me","地下车库。老默拉开车门坐进来，像每一次那样，先给丫丫的家教费报了账。然后他压低声音。"],
  ["mo","强哥。安欣的住址、巡逻班次，都摸清了。您一句话——今晚，吃鱼吗？"],
  ["qin","车里静得能听见心跳。老默的手，稳得像二十年前那个修车摊。"]],
 choices:[
  {t:"『老默，把名单烧了。安欣，不许动。』",fx:{heart:12,con:2},set:{baoanxin:true},note:"初心 +12",next:"c3_6"},
  {t:"沉默十秒，说：『按你的想法办。』",fx:{heart:-18,risk:14},set:{xuezhai2:true},note:"初心 -18 风险 +14",next:"c3_6"}]},
c3_6:{bg:"bg-tower",deco:"🎀",
 lines:[
  ["me","又是几年。大嫂走的那天，京海下了很大的雨。从那以后，陪你吃饭的人，只剩下瑶瑶。"],
  ["yao","爸。我整理了书房，发现一个上锁的抽屉……我没开。我只是想问，咱家的钱，都是干干净净的吗？"],
  ["qin","她眼里有大嫂的影子。她要是干净，就让她干净到底。"]],
 choices:[
  {t:"教她看报表、管账目——黄家的女儿，要接得住盘子",fx:{con:6,rep:4,affYao:5},note:"人脉 +6",next:"w3"},
  {t:"『瑶瑶，听话。这个抽屉，永远别打开。毕业后离开京海。』",fx:{heart:10,affYao:6},set:{yaogan:true},note:"初心 +10",next:"w3"},
  {t:"什么也不说，只是摸了摸她的头",fx:{heart:2,affYao:3},next:"w3"}]},
w3:{wave:"w3",next:"c3_chk"},
c3_chk:{hidden:true,route:s=>s.risk>=75?"g_net":"c4_1a",alt:["g_net","c4_1a"]},

/* ---------- 第四章 2021 · 潮水退去 ---------- */
c4_1a:{era:{y:"第 四 章 · 二 ○ 二 一",t:"潮水退去",s:"教育整顿驻点指导组进驻京海。潮水退去的时候，才知道谁在裸泳。",chap:4},next:"c4_1"},
c4_1:{bg:"bg-rain",deco:"📋",
 lines:[
  ["me","2021年。中央教育整顿驻点指导组进驻京海，组长徐忠。指导组的车子碾过雨水，停在强盛大厦楼下那天，整座城市都听见了。"],
  ["me","唐小龙被带走的那晚，强盛大厦的灯一盏一盏熄灭。京海的报纸用了一个词——『收网』。"]],
 choices:[
  {t:"紧急召开家族会议，商量对策",next:"c4_2"}]},
c4_2:{bg:"bg-rain",deco:"🎩",
 lines:[
  ["me","电视里，赵立冬戴着手铐走下警车。镜头扫过，他忽然朝镜头笑了笑——所有人都知道那个笑是什么意思。"],
  ["xz","高启强同志，指导组这里，有一份1996年到2021年的清单，越来越长。我们是来听你说的，不是来抓你——今天。"]],
 choices:[{t:"静观其变，等指导组先出牌",fx:{heart:1},next:"c4_3"}],
 cardOpts:{yuanjiao:{t:"抢先向指导组交出赵立冬的罪证，变被动为主动",fx:{risk:-10,heart:4},set:{tanzhu:true},next:"c4_3"}}},
c4_3:{bg:"bg-cell",deco:"🎀",
 lines:[
  ["me","深夜，书房。黄瑶坐在你对面，桌上摆着一个打开的抽屉，和一本泛黄的账本。"],
  ["yao","爸。账本我全看完了。白叔的事、徐江的事、启盛叔的事……我抱着它坐了一整夜。指导组的人说，你可以选。"],
  ["qin","我养大的姑娘，替我打开了最后一个抽屉。这一夜，谁都别想再骗自己了。"]],
 choices:[
  {t:"抢过账本，塞进壁炉。烧了它，烧了就干净了",fx:{heart:-16,risk:6,affYao:-8},set:{shaozhang:true},note:"初心 -16",next:"c4_4"},
  {t:"把账本推到她面前：『瑶瑶，交出去。这是爸最后能做的事。』",fx:{heart:16,affYao:8},set:{renzui:true},note:"初心 +16",next:"c4_4"},
  {t:"安排她当晚出国：『账在爸这儿，跟你没关系。』",fx:{heart:8,rep:4,affYao:4},set:{yaogan:true},note:"初心 +8",next:"c4_4"},
  {t:"把 1996 年以来的事，原原本本讲给她听",req:{aff:"yao",min:60},fx:{heart:12,affYao:6},set:{truth:true},note:"初心 +12",next:"c4_4"}]},
c4_4:{bg:"bg-cell",deco:"🥟",
 lines:[
  ["me","最后见安欣，是在强盛大厦的顶层。没有手铐，没有审讯室。他带了一份打包的饺子，放在桌上，像二十年前那个除夕。"],
  ["an","高启强，最后一面。徐忠组长让我带一句话：指导组的门开着，路的另一头，还是那条旧厂街。"],
  ["qin","我看着他。二十年前他递给我饺子的时候，我是京海最穷的人；今天他递给我筷子，我还是。绕了二十年，原来最贵的从来不是鱼。"]],
 choices:[
  {t:"『我跟你走。先去旧厂街，再看一眼鱼摊。』——自首",next:"end_route"},
  {t:"『我高启强这辈子，没输过。要抓我，让你的人进来拿。』——鱼死网破",next:"e_chaos"},
  {t:"当夜坐渔船出海：『风浪越大，鱼越贵。』——跑路",next:"e_run"}]},

/* ---------- 结局 ---------- */
end_route:{hidden:true,route:s=>{
  if(s.set.shaozhang) return "e_burn";
  if(s.heart>=60&&(s.set.liangzhi||s.aff.an>=75)) return "e_newlife";
  if(s.rep>=70) return "e_peak";
  return "e_tide";},alt:["e_burn","e_newlife","e_peak","e_tide"]},

e_tide:{ending:{id:"tide",name:"潮 退",text:"你跟着安欣走出大厦，在旧厂街的拆迁废墟前站了很久。当年鱼摊的位置，如今是一块平整的水泥地。\n\n判决下来那天，京海下了场大雨。法庭最后陈述，你只说了一句：『我这一辈子，最对不起的人是安欣，最想回去的，是2000年的那个鱼摊。』\n\n潮水退去，人们说你曾经站上京海之巅。只有你自己知道，从举起那条冻鱼开始，你就已经开始往下走了。"},
 fates:[["安欣","守着那碗饺子的约定，看着你走进高墙"],["高启盛","（结局随你的选择而不同）"],["黄瑶","在指导组的护送下，开始了普通人的生活"]]},
e_peak:{ending:{id:"peak",name:"京海之王 · 梦 醒",text:"你曾拥有过整座京海：六十六层的楼、全城的敬畏、说一不二的二十年。\n\n宣判那天，旁听席坐满了人。记者数过，你涉案的卷宗摞起来一米八高——正好是你从鱼摊『长』出来的高度。\n\n铁窗内，你常常梦见凌晨三点的菜市场。梦里你永远是那个数着零钱、给弟弟妹妹买排骨的卖鱼佬。醒来才发现，京海之王，原来是一场二十年的大梦。"},
 fates:[["强盛集团","资产冻结清算，大厦换了招牌"],["旧部","树倒猢狲散，再没人喊你『强哥』"],["安欣","把《孙子兵法》还给了你——当年他借你的那本"]]},

let AC=null;

function beep(f,d,type,vol){if(!snd)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();
 o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||.05;o.connect(g);g.connect(a.destination);
 o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d);}catch(e){}}
const sfxTick=()=>beep(920,.03,"square",.012);

const sfxBad=()=>{beep(180,.2,"sawtooth",.04)};
const sfxBig=()=>{beep(330,.15,"sine",.06);setTimeout(()=>beep(440,.15,"sine",.06),120);setTimeout(()=>beep(660,.25,"sine",.06),240)};

function flo(chip,txt,up){const d=document.createElement("span");
 d.className="flo "+(up?"up":"dn");d.textContent=txt;chip.appendChild(d);
 setTimeout(()=>d.remove(),1100);}
function applyFx(fx,el){
 if(!fx)return;const map={money:"c_money",rep:"c_rep",con:"c_con",risk:"c_risk",heart:"c_heart"};
 for(const k in fx){const v=fx[k];if(!v)continue;
  if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(st.aff[id]===undefined)continue;
   st.aff[id]=clamp(st.aff[id]+v);flo($("c_aff"),(v>0?"+":"")+v+" "+AFF[id].n,v>0);continue;}
  if(k==="money")st.money=Math.max(0,st.money+v);else st[k]=clamp(st[k]+v);
  flo($(map[k]),(k==="money"?((v>0?"+":"")+fmtMoney(v)):((v>0?"+":"")+v)),v>0);
  if(k==="risk"&&v>0)sfxBad();else if(v>0&&(k==="rep"||k==="heart"))sfxOk();}
 hudChips();
}

function enter(id){
 if(!id||!S[id]){console.error("missing scene",id);return;}
 curId=id;const s=S[id];
 if(s.era){showEra(s.era,s.next);return;}
 if(s.wave){startWave(s.wave,s.next);return;}

 if(s.hidden&&s.route){enter(s.route(st));return;}
 bgOf(id);$("hud").style.display="flex";
 if(s.chTag)$("chTag").textContent=s.chTag;
 applyFx(s.fx);if(s.set)Object.assign(st.set,s.set);
 hudChips();
 checkAch();

function renderLines(s,i){

 if(i>=s.lines.length){
  if(s.choices){renderChoices(s);}else if(typeof s.next==="function"){enter(s.next(st));}

 typing=setInterval(()=>{
  tEl.textContent=txt.slice(0,++p);

 },26);
 clickHandler=()=>{if(typing){clearInterval(typing);typing=null;tEl.textContent=txt;$("hint").style.visibility="visible";}else renderLines(s,i+1);};

function reqOk(req){if(!req)return true;if(req.flag&&!st.set[req.flag])return false;
 if(req.aff&&(st.aff[req.aff]||0)<req.min)return false;
 if(req.min&&req.stat&&st[req.stat]<req.min)return false;return true;}
function reqText(req){if(!req)return"";
 if(req.flag)return"需要：关键剧情线";
 if(req.aff)return"需要："+AFF[req.aff].n+" 好感 ≥ "+req.min;
 if(req.min)return"需要："+({rep:"声望",con:"人脉",heart:"初心",risk:"风险"}[req.stat])+" ≥ "+req.min;return"";}
function fxNote(fx){if(!fx)return"";const m={money:"资金",rep:"声望",con:"人脉",risk:"风险",heart:"初心",
 affAn:"安欣好感",affSheng:"启盛好感",affLan:"启兰好感",affSao:"大嫂好感",affMo:"老默好感",affYao:"瑶瑶好感"};
 return Object.keys(fx).filter(k=>fx[k]&&m[k]).map(k=>{const v=fx[k];return (k==="money"?((v>0?"+":"")+fmtMoney(v)):(v>0?"+":"")+v)+" "+m[k]}).join(" ");

function renderChoices(s){
 const box=$("choices");box.innerHTML="";
 let opts=(s.choices||[]).slice();
 if(s.cardOpts)for(const ck in s.cardOpts){if(st.cards[ck])opts.push(Object.assign({},s.cardOpts[ck],{card:ck}));}
 opts.forEach(ch=>{
  const ok=reqOk(ch.req);
  const b=document.createElement("button");b.className="choice"+(ok?"":" lock")+(ch.card?" cardOpt":"");
  const note=(ch.card?"打出「"+CARDS[ch.card].n+"」 · ":""+fxNote(ch.fx))||(ch.set?Object.keys(ch.set).map(k=>FLAG_NAMES[k]).filter(Boolean).join("、"):"");
  b.innerHTML='<span>'+ch.t+'</span>'+(note?'<span class="fx">'+(ok?"":"🔒 ")+note+'</span>':"");
  b.onclick=()=>{if(!ok){toast(reqText(ch.req));sfxBad();return;}
   sfxOk();if(ch.card){st.cards[ch.card]=false;toast("打出谋略卡「"+CARDS[ch.card].n+"」");}

 const btns=document.createElement("div");btns.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
 if(ev.ch){ev.ch.forEach(c=>{const b=document.createElement("button");b.className="wAct";b.style.flex="1";
  b.innerHTML=c.t+'<span class="wd">'+fxNote(c.fx)+'</span>';
  b.onclick=()=>{applyFx(c.fx);box.style.display="none";$("wLog").textContent=c.t;nextTurn();};btns.appendChild(b);});}
 else{const b=document.createElement("button");b.className="wAct";b.textContent="知道了";b.style.flex="1";
  b.onclick=()=>{if(ev.fx)applyFx(ev.fx);box.style.display="none";nextTurn();};btns.appendChild(b);}
 box.appendChild(btns);
}
function nextTurn(){
 if(st.wave.turn>=WAVES[st.wave.id].turns){finishWave();return;}
 renderWave();saveGame();
}
function finishWave(){
 const nx=waveNext;st.wave=null;$("wave").classList.remove("show");
 checkAch();enter(nx);
}
$("wSkip").onclick=()=>{if(!st||!st.wave)return;
 st.wave.turn=WAVES[st.wave.id].turns;toast("你草草应付了经营——风浪不会等人");finishWave();};

/* ================= V2 引擎：成就 ================= */
const KEY_ACH="gq_ach";
function achMap(){try{return JSON.parse(LSget(KEY_ACH)||"{}")}catch(e){return{}}}
function checkAch(){
 if(!st)return;const got=achMap();
 ACH.forEach(a=>{if(got[a.id])return;let ok=false;try{ok=a.c(st)}catch(e){}
  if(ok){got[a.id]=1;LSset(KEY_ACH,JSON.stringify(got));
   st.achRun=(st.achRun||[]).concat(a.id);toast("🏆 成就解锁："+a.n);sfxBig();}});
}

/* ================= V2 引擎：好感 / 卡牌面板 ================= */
function openPanel(kind){
 const b=$("pBody");
 if(kind==="aff"){$("pTitle").textContent="人 物 好 感";
  b.innerHTML=Object.keys(AFF).map(id=>{const v=(st&&st.aff[id])||0;const A=AFF[id];
   return '<div class="affRow"><span class="av" style="border-color:'+A.c+'">'+A.e+'</span>'+
    '<span style="width:56px;flex:none">'+A.n+'</span>'+
    '<span class="bar"><i style="width:'+v+'%;background:'+A.c+'"></i></span>'+
    '<span class="st">'+v+' · '+affStatus(id,v)+'</span></div>';}).join("")+
   '<div style="font-size:11.5px;color:var(--dim);margin-top:10px">好感由剧情选择与风浪回合累积，影响部分隐藏选项与人物命运。</div>';}
 else{$("pTitle").textContent="谋 略 卡 ·《孙子兵法》";
  b.innerHTML=Object.keys(CARDS).map(k=>{const sv=st?st.cards[k]:undefined;
   const note=sv===true?"（持有 · 可于关键剧情打出）":sv===false?"（已打出）":"（尚未习得 · 风浪回合研读可得）";
   return '<div class="cardRow" style="opacity:'+(sv===true?"1":"0.45")+'"><span class="cn">🃏 '+CARDS[k].n+'</span><span class="cd">'+CARDS[k].d+note+'</span></div>';}).join("");}
 $("panel").classList.add("show");saveGame();
}
$("c_aff").onclick=()=>{if(st)openPanel("aff");};
$("c_cards").onclick=()=>{if(st)openPanel("cards");};
$("pClose").onclick=()=>$("panel").classList.remove("show");

/* ================= 存档 / 流程 ================= */
function saveGame(){st.node=curId;LSset(KEY_SAVE,JSON.stringify(st));}
function startNew(){st=fresh();st.chap=1;$("title").classList.remove("show");$("ending").classList.remove("show");$("wave").classList.remove("show");$("panel").classList.remove("show");enter("c1_1");}
function cont(){try{const s0=JSON.parse(LSget(KEY_SAVE));const f=fresh();
 f.set=Object.assign(f.set,s0.set||{});f.aff=Object.assign(f.aff,s0.aff||{});f.cards=Object.assign(f.cards,s0.cards||{});
 st=Object.assign(f,s0);st.node=s0.node||"c1_1";
 $("title").classList.remove("show");enter(st.node);}catch(e){startNew();}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800);}
$("btnNew").onclick=startNew;
$("btnCont").onclick=cont;
$("btnGal").onclick=showGallery;
$("btnGal2").onclick=showGallery;
$("btnGalBack").onclick=()=>{$("gallery").classList.remove("show");if(!st)$("title").classList.add("show");};
$("btnAgain").onclick=()=>{$("ending").classList.remove("show");startNew();};
$("btnHome").onclick=()=>{$("ending").classList.remove("show");st=null;$("title").classList.add("show");};
 if(LSget(KEY_SAVE))$("btnCont").style.display="";

/* ================= 自检 ================= */
window.__qa=function(n){
 n=n||300;const errs=[];let ends=0;
 // 静态：next 引用与 alt 枚举
 for(const id in S){const s=S[id];
  if(typeof showEra!=="function")errs.push("showEra 函数缺失");
  if(s.era&&!s.next)errs.push(id+" era 缺少 next");
  if(s.wave&&!WAVES[s.wave])errs.push(id+" 未知风浪 "+s.wave);
  if(s.cardOpts)for(const k in s.cardOpts){if(!CARDS[k])errs.push(id+" 未知卡牌 "+k);
   const c=s.cardOpts[k];if(c.next&&!S[c.next])errs.push(id+" 卡牌选项缺失 "+c.next);}
  if(s.next&&typeof s.next!=="function"&&!S[s.next])errs.push(id+" -> 缺失节点 "+s.next);
  if(s.alt)s.alt.forEach(a=>{if(!S[a])errs.push(id+" alt 缺失 "+a)});
  if(s.choices)s.choices.forEach((c,i)=>{if(c.next&&typeof c.next!=="function"&&!S[c.next])errs.push(id+" 选择"+i+" 缺失 "+c.next)});
  if(!s.lines&&!s.choices&&!s.ending&&!s.hidden&&!s.era&&!s.wave)errs.push(id+" 空节点");}
 // 动态：随机通关
 for(let t=0;t<n;t++){const s0=fresh();let node="c1_1",steps=0;
  try{while(steps++<300){const sc=S[node];
   if(!sc){errs.push("运行期缺失节点 "+node);break;}
   if(sc.ending){ends++;break;}
   if(sc.hidden){node=sc.route(s0);continue;}
   if(sc.wave){const W=WAVES[sc.wave];let t=0;
    while(t++<W.turns){const a=ACTIONS[W.acts[Math.floor(Math.random()*W.acts.length)]];
     const r=a.run(s0,W);applyFx2(s0,r.fx);
     if(Math.random()<0.45&&W.evs.length){const ev=W.evs[Math.floor(Math.random()*W.evs.length)];
      if(ev.fx)applyFx2(s0,ev.fx);
      if(ev.ch)applyFx2(s0,ev.ch[Math.floor(Math.random()*ev.ch.length)].fx);}}
    node=sc.next;continue;}
   if(sc.choices){const ok=sc.choices.filter(c=>reqOk(c));const pick=ok[Math.floor(Math.random()*ok.length)]||sc.choices[0];
    applyFx2(s0,pick.fx);if(pick.set)Object.assign(s0.set,pick.set);node=pick.route?pick.route(s0):pick.next;continue;}
   let nx=sc.next;if(typeof nx==="function")nx=nx(s0);node=nx;}}catch(e){errs.push("异常:"+e.message+" @"+node)}
 }
 return JSON.stringify({errs:errs.slice(0,20),errCount:errs.length,endingsReached:ends,runs:n});
};
function applyFx2(s,fx){if(!fx)return;for(const k in fx){const v=fx[k];if(!v)continue;
 if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(s.aff[id]!==undefined)s.aff[id]=clamp(s.aff[id]+v);continue;}
 if(k==="money")s.money=Math.max(0,s.money+v);else s[k]=clamp(s[k]+v);}}
window.__goto=function(id){st=st||fresh();$("title").classList.remove("show");enter(id);};
window.__st=()=>st;
</script>
