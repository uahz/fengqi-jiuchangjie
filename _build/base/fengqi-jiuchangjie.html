  --ink:#3a3226; --ink2:#5a4f42; --ink3:#8a7a6a; --paper:#fdf7ea;
  --shadow-s:0_2px_8px_rgba(124,185,168,.15);
  --sh-s:0 2px 8px rgba(124,185,168,.15);
  --sh-m:0 4px 16px rgba(124,185,168,.2);
  --sh-l:0 8px 32px rgba(124,185,168,.25);
  --sh-h:0 8px 24px rgba(124,185,168,.3);
  --serif:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --ui:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(180deg,#dcecdf 0%,var(--cream) 42%,#f0ddb5 100%);color:var(--ink);
  font-family:var(--ui);overflow:hidden;user-select:none}
button{font-family:var(--ui);cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 舞台：梦幻渐变 + 云朵 + 水彩纹理 ---------- */
#stage{position:absolute;inset:0;transition:opacity .6s}
#bg{position:absolute;inset:0;transition:background 1.2s}
#deco{position:absolute;right:5%;top:9%;font-size:170px;opacity:.09;filter:sepia(.25) saturate(.7);pointer-events:none;transition:all 1s}
#stage::before,#stage::after{content:"";position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));animation:drift 30s ease-in-out infinite alternate}
#stage::before{width:340px;height:120px;left:5%;top:10%;opacity:.75}
#stage::after{width:260px;height:95px;right:7%;top:20%;opacity:.6;animation-duration:38s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(48px)}}
#fog{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(45deg,rgba(124,185,168,.028) 0 2px,transparent 2px 7px),
  radial-gradient(ellipse at 50% 118%,rgba(90,74,58,.16) 0%,rgba(90,74,58,0) 62%)}
.bg-market{background:radial-gradient(ellipse at 18% 0%,rgba(255,205,130,.4),transparent 55%),linear-gradient(180deg,#f6e7c6 0%,#f4e4bc 55%,#eed9ae 100%)}
.bg-station{background:radial-gradient(ellipse at 75% 0%,rgba(133,205,202,.32),transparent 55%),linear-gradient(180deg,#e3efe9 0%,#f4e4bc 60%,#eed9ae 100%)}
.bg-jinhan{background:radial-gradient(ellipse at 50% 0%,rgba(232,168,124,.42),transparent 58%),linear-gradient(180deg,#f8e3cd 0%,#f4e4bc 58%,#ecd6a8 100%)}
.bg-tower{background:radial-gradient(ellipse at 80% 10%,rgba(133,205,202,.3),transparent 55%),linear-gradient(180deg,#e4f0e9 0%,#f4e4bc 58%,#edd9af 100%)}
.bg-rain{background:radial-gradient(ellipse at 50% 0%,rgba(160,180,175,.28),transparent 58%),linear-gradient(180deg,#e2e8df 0%,#f1e3c2 60%,#ead7ab 100%)}
.bg-cell{background:radial-gradient(ellipse at 50% 100%,rgba(195,141,148,.2),transparent 60%),linear-gradient(180deg,#efe6d2 0%,#f4e4bc 60%,#ecd7ab 100%)}
.bg-dawn{background:radial-gradient(ellipse at 50% 112%,rgba(255,190,120,.5),transparent 60%),linear-gradient(180deg,#f9e9c8 0%,#f4e4bc 55%,#efdaad 100%)}

/* ---------- 顶部状态栏 ---------- */
#hud{position:relative;z-index:5;display:none;flex-wrap:wrap;gap:6px;align-items:center;
  padding:10px 16px;background:rgba(253,247,234,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(124,185,168,.4)}
#chTag{font-family:var(--serif);color:#6b5a3e;font-size:14px;font-weight:600;letter-spacing:2px;margin-right:8px;white-space:nowrap}
.chip{display:flex;align-items:center;gap:5px;font-size:13px;padding:4px 11px;border:1px solid rgba(124,185,168,.4);
  border-radius:999px;background:var(--paper);color:var(--ink2);position:relative;white-space:nowrap}
.chip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.warn{border-color:rgba(195,141,148,.65);background:#f7e4e0;color:#8a4a44;animation:softpulse 2.4s ease-in-out infinite}
@keyframes softpulse{50%{box-shadow:0 0 0 5px rgba(195,141,148,.14)}}
.chip.btn{cursor:pointer;transition:all .3s ease-out}
.chip.btn:hover{transform:scale(1.05);box-shadow:var(--sh-s)}
#sndBtn{margin-left:auto;background:var(--paper);border:1px solid rgba(124,185,168,.4);color:var(--ink2);border-radius:999px;padding:4px 12px;font-size:13px;transition:all .3s ease-out}
#sndBtn:hover{color:var(--ink);transform:scale(1.05)}
.flo{position:absolute;right:8px;top:-6px;font-size:12px;font-weight:700;pointer-events:none;animation:flo 1.1s forwards}
.flo.up{color:#5f8f63}.flo.dn{color:#b4574e}
@keyframes flo{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-16px)}}

/* ---------- 对话区 ---------- */
#bottom{position:relative;z-index:5;margin-top:auto;padding:12px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
#dlg{width:min(920px,100%);background:var(--paper);border:1px solid rgba(124,185,168,.4);border-radius:16px;
  padding:18px 22px 16px;min-height:132px;position:relative;box-shadow:var(--sh-m)}
#who{position:absolute;top:-14px;left:18px;display:inline-flex;align-items:center;gap:6px;background:var(--cream);
  border:1px solid rgba(124,185,168,.4);border-radius:999px;padding:3px 12px 3px 6px;font-size:13px;font-weight:600;letter-spacing:1px;box-shadow:var(--sh-s)}
#who .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--cream);border:1px solid rgba(124,185,168,.45)}
#txt{font-family:var(--serif);font-size:18.5px;line-height:1.9;letter-spacing:.4px;min-height:70px;color:var(--ink);white-space:pre-wrap}
#hint{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--ink3);opacity:.8;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

#choices{width:min(920px,100%);display:flex;flex-direction:column;gap:9px}
.choice{position:relative;text-align:left;background:var(--paper);border:1px solid rgba(124,185,168,.4);
  border-radius:16px;color:var(--ink);font-size:15.5px;font-weight:500;padding:12px 16px 12px 44px;line-height:1.55;
  box-shadow:var(--sh-s);transition:all .3s ease-out}
.choice::before{content:"❀";position:absolute;left:15px;top:12px;color:var(--coral);font-size:14px}
.choice:hover{transform:scale(1.02);box-shadow:var(--sh-h);border-color:rgba(124,185,168,.75)}
.choice:active{transform:scale(.98)}
.choice .fx{display:block;font-size:12px;color:var(--ink3);margin-top:3px;font-family:var(--ui)}
.choice.lock{opacity:.45;cursor:not-allowed}
.choice.lock:hover{transform:none;box-shadow:var(--sh-s)}
.choice.lock::before{content:"🔒";font-size:12px;color:var(--ink3)}
.choice.cardOpt{background:#ecf4ef;border-color:rgba(124,185,168,.65)}
.choice.cardOpt::before{content:"🃏";font-size:13px}

/* ---------- Q版人物立绘 ---------- */
#chibi{position:absolute;right:18px;bottom:100%;width:94px;margin-bottom:-32px;pointer-events:none;z-index:6;
  opacity:0;transform:translateY(10px) scale(.86);transition:opacity .45s ease-out,transform .45s ease-out}
#chibi.show{opacity:1;transform:translateY(0) scale(1)}
#chibi svg{display:block;width:100%;filter:drop-shadow(0 5px 9px rgba(124,185,168,.4));animation:bob 3.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

/* ---------- 第三视角场景插画 ---------- */
#sceneArt{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneEnv{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image .8s ease-out}
#scenePhotoTint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,16,12,.42) 0%,rgba(20,16,12,.18) 38%,rgba(12,10,8,.55) 100%)}
#sceneArt .fig{position:absolute;bottom:16.5%;transition:opacity .5s ease-out}
#sceneArt .fig svg{display:block;width:100%;filter:drop-shadow(0 6px 10px rgba(90,74,58,.3))}
#figL{left:8%;width:13.5%;min-width:104px}
#figR{right:8%;width:12.5%;min-width:96px}
#chibi{display:none}
#deco{display:none}
.bg-rain::after{content:"";position:absolute;inset:-40% -10%;pointer-events:none;
  background:repeating-linear-gradient(78deg,rgba(190,210,240,.09) 0 1.5px,transparent 1.5px 10px);
  animation:rainmove .6s linear infinite}
@keyframes rainmove{from{transform:translateY(0)}to{transform:translateY(22px)}}

/* ---------- 覆盖层 ---------- */
.ovl{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:24px;overflow:auto}
.ovl.show{display:flex}
#era{background:linear-gradient(180deg,#e7f0e6 0%,var(--cream) 55%,#f0ddb5 100%)}
#era .y{font-size:14px;letter-spacing:8px;color:var(--ink2);margin-bottom:16px}
#era .t{font-family:var(--serif);font-size:52px;font-weight:600;letter-spacing:10px;color:var(--ink)}
#era .s{margin-top:20px;color:var(--ink2);font-family:var(--serif);font-size:16px;line-height:2;max-width:520px}
#era .go{margin-top:46px;background:var(--sage);color:#fff;border:none;border-radius:16px;
  padding:11px 34px;font-size:14px;font-weight:600;letter-spacing:3px;box-shadow:var(--sh-m);transition:all .5s ease-in-out}
#era .go:hover{transform:scale(1.05);box-shadow:var(--sh-h)}
#era .go:active{transform:scale(.98)}

#title{background:
  radial-gradient(ellipse at 20% 12%,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 40%),
  radial-gradient(ellipse at 82% 22%,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 36%),
  linear-gradient(180deg,#dcecdf 0%,var(--cream) 46%,#f0ddb5 100%)}
#title .fish{font-size:64px;margin-bottom:8px;filter:drop-shadow(0 6px 18px rgba(124,185,168,.45));animation:hover-fish 5s ease-in-out infinite alternate}
@keyframes hover-fish{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-8px) rotate(1deg)}}
#title h1{font-family:var(--serif);font-size:clamp(40px,8vw,76px);font-weight:600;letter-spacing:14px;text-indent:14px;color:var(--ink)}
#title .sub{margin-top:14px;color:#7a5a34;letter-spacing:6px;font-size:15px;font-weight:600}
#title .desc{margin-top:16px;color:var(--ink2);font-size:13.5px;line-height:2.1;max-width:520px}
#title .btns{margin-top:38px;display:flex;flex-direction:column;gap:12px;width:min(320px,82vw)}
.mbtn{background:var(--paper);border:1px solid rgba(124,185,168,.4);color:var(--ink);border-radius:16px;
  padding:13px 20px;font-size:15.5px;font-weight:600;letter-spacing:3px;box-shadow:var(--sh-m);transition:all .5s ease-in-out}
.mbtn:hover{transform:scale(1.03);box-shadow:var(--sh-h)}
.mbtn:active{transform:scale(.98)}
.mbtn.pri{background:var(--sage);color:#fff;border-color:rgba(124,185,168,.55)}

/* ---------- 结局 ---------- */
#ending{background:linear-gradient(180deg,#e7f0e6 0%,var(--cream) 55%,#f0ddb5 100%)}
#endCard{position:relative;width:min(760px,100%);background:var(--paper);border:1px solid rgba(124,185,168,.4);border-radius:16px;
  padding:34px 34px 28px;text-align:left;box-shadow:var(--sh-l)}
#endCard .tag{color:var(--ink3);letter-spacing:4px;font-size:12px}
#endName{font-family:var(--serif);font-size:42px;font-weight:600;letter-spacing:8px;margin:10px 0 4px;color:#7a5a34}
#endGrade{position:absolute;right:34px;top:30px;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:38px;border:3px solid #b8860b;color:#b8860b;background:var(--cream);box-shadow:var(--sh-s)}
#endText{font-family:var(--serif);font-size:16.5px;line-height:2.1;color:var(--ink);margin:14px 0 18px;white-space:pre-wrap}
#fates{border-top:1px dashed rgba(124,185,168,.5);padding-top:14px;display:grid;gap:6px;font-size:13.5px;color:var(--ink2)}
#fates b{color:var(--ink);font-weight:600;margin-right:8px}
#endStats{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px}
#endStats span{border:1px solid rgba(124,185,168,.4);border-radius:999px;padding:3px 10px;color:var(--ink2);background:var(--cream)}
#endBtns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
#endBtns .mbtn{padding:10px 22px;font-size:14px;letter-spacing:2px}

/* ---------- 图鉴 / 面板 ---------- */
#gallery{background:linear-gradient(180deg,#e7f0e6 0%,var(--cream) 60%,#f0ddb5 100%)}
#gallery h2{font-family:var(--serif);letter-spacing:8px;font-size:30px;font-weight:600;color:#7a5a34;margin-bottom:20px}
#gGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:min(860px,100%)}
.gslot{border:1px solid rgba(124,185,168,.4);border-radius:16px;padding:16px 14px;text-align:left;background:var(--paper);box-shadow:var(--sh-s)}
.gslot.on{border-color:rgba(184,134,11,.55);background:#fdf3dd}
.gslot .gn{font-family:var(--serif);font-size:19px;letter-spacing:3px;color:var(--ink)}
.gslot.on .gn{color:#a2711a}
.gslot .gd{margin-top:6px;font-size:12.5px;color:var(--ink3);line-height:1.7}
.gslot.off{opacity:.5}

#wave{background:rgba(244,228,188,.9);backdrop-filter:blur(6px)}
#panel{background:rgba(244,228,188,.9);backdrop-filter:blur(6px)}
.waveCard{width:min(720px,100%);background:var(--paper);border:1px solid rgba(124,185,168,.4);border-radius:16px;
  padding:26px 26px 20px;text-align:left;box-shadow:var(--sh-l);max-height:92vh;overflow:auto}
.wEra{color:var(--ink3);letter-spacing:4px;font-size:12px}
.wTitle{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:8px;color:#7a5a34;margin:6px 0 2px}
.wTurn{font-size:13px;color:var(--ink2);margin-bottom:4px}
.wHint{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.wActs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wAct{background:var(--paper);border:1px solid rgba(124,185,168,.4);border-radius:16px;color:var(--ink);
  padding:11px 13px;text-align:left;font-size:14px;font-weight:600;box-shadow:var(--sh-s);transition:all .4s ease-in-out}
.wAct:hover{transform:scale(1.03);box-shadow:var(--sh-h)}
.wAct:active{transform:scale(.98)}
.wAct .wd{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;font-weight:400}
.wLog{margin-top:12px;font-size:13px;color:#4e7d63;min-height:18px;line-height:1.7;white-space:pre-wrap}
#evBox{margin:10px 0 4px;border:1px solid rgba(232,168,124,.55);border-radius:16px;padding:12px 14px;background:#fdf1df}
#evBox .et{font-family:var(--serif);color:#9a6a2e;font-size:16px;font-weight:600;margin-bottom:6px}
#evBox .ed{font-size:13.5px;line-height:1.85;color:var(--ink);margin-bottom:10px;white-space:pre-wrap}
.wSkip{margin-top:14px;background:none;border:1px dashed rgba(124,185,168,.6);color:var(--ink3);border-radius:999px;padding:6px 16px;font-size:12px;transition:all .3s ease-out}
.wSkip:hover{color:var(--ink);transform:scale(1.04)}

.panelCard{width:min(560px,100%);background:var(--paper);border:1px solid rgba(124,185,168,.4);border-radius:16px;
  padding:24px;max-height:88vh;overflow:auto;text-align:left;box-shadow:var(--sh-l)}
.pTitle{font-family:var(--serif);letter-spacing:6px;font-size:22px;font-weight:600;color:#7a5a34;margin-bottom:14px}
.affRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(124,185,168,.4);font-size:14px}
.affRow .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--cream);border:1px solid rgba(124,185,168,.45);font-size:15px;flex:none}
.affRow .bar{flex:1;height:8px;border-radius:99px;background:rgba(124,185,168,.18);overflow:hidden}
.affRow .bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease-in-out}
.affRow .st{width:158px;font-size:11.5px;color:var(--ink3);text-align:right;flex:none}
.cardRow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed rgba(124,185,168,.4);font-size:13.5px}
.cardRow .cn{color:#7a5a34;font-family:var(--serif);letter-spacing:2px;flex:none;font-weight:600}
.cardRow .cd{color:var(--ink2);line-height:1.7}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.tabs button{background:var(--paper);border:1px solid rgba(124,185,168,.4);color:var(--ink2);border-radius:999px;padding:6px 18px;font-size:13px;font-weight:600;transition:all .3s ease-out}
.tabs button:hover{transform:scale(1.05)}
.tabs button.on{background:var(--sage);color:#fff;border-color:rgba(124,185,168,.6)}
.achGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;width:min(760px,100%)}
.ach{border:1px solid rgba(124,185,168,.4);border-radius:16px;padding:12px 14px;text-align:left;background:var(--paper);box-shadow:var(--sh-s)}
.ach.on{border-color:rgba(184,134,11,.5);background:#fdf3dd}
.ach .an{font-size:14.5px;font-weight:600;color:var(--ink)}
.ach.on .an{color:#a2711a}
.ach .ad{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.6}
.ach.off{opacity:.55}

#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:80;background:#5f8f63;color:#fff;
  border-radius:999px;padding:8px 22px;font-size:14px;letter-spacing:2px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .5s ease-in-out;box-shadow:var(--sh-m)}
#toast.show{opacity:1}

@media (max-width:640px){
  #txt{font-size:16px}#era .t{font-size:34px;letter-spacing:6px}#endName{font-size:30px}
  #deco{font-size:100px}#hud{padding:6px 8px}.chip{font-size:11.5px;padding:2px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="bg" class="bg-market"></div><div id="sceneArt"><div id="sceneEnv"></div><div id="scenePhotoTint"></div><div class="fig" id="figL"></div><div class="fig" id="figR"></div></div><div id="deco">🐟</div><div id="fog"></div></div>
  <div id="hud">
    <span id="chTag">序章</span>
    <span class="chip" id="c_money">💰 资金 <b>0</b></span>
    <span class="chip" id="c_rep">🐟 声望 <b>0</b></span>
    <span class="chip" id="c_con">🤝 人脉 <b>0</b></span>
    <span class="chip" id="c_risk">⚠️ 风险 <b>0</b></span>
    <span class="chip" id="c_heart">❤️ 初心 <b>0</b></span>
    <span class="chip btn" id="c_cards" title="谋略卡">🃏 <b>0</b></span>
    <span class="chip btn" id="c_aff" title="人物好感">👥 好感</span>
    <span class="chip" id="c_flag" style="display:none"></span>
    <button id="sndBtn" title="音效开关">🔊 音效</button>
  </div>
  <div id="bottom">
    <div id="choices"></div>
    <div id="dlg"><div id="chibi"></div><div id="who"><span class="av" id="whoAv">🐟</span><span id="whoName">高启强</span></div>
      <div id="txt"></div><div id="hint">点击继续 ▸</div></div>
  </div>
</div>

<div id="era" class="ovl"><div class="y" id="eraY"></div><div class="t" id="eraT"></div><div class="s" id="eraS"></div><button class="go" id="eraGo">进 入 故 事</button></div>

<div id="wave" class="ovl"><div class="waveCard">
  <div class="wEra" id="wEra"></div>
  <div class="wTitle">风 浪 回 合</div>
  <div class="wTurn" id="wTurn"></div>
  <div class="wHint">一个时代不是一天过的。每回合做一件事，风浪会随时降临。</div>
  <div id="evBox" style="display:none"></div>
  <div id="wActs" class="wActs"></div>
  <div class="wLog" id="wLog"></div>
  <button class="wSkip" id="wSkip">草草应付，直接翻篇 →</button>
</div></div>

<div id="panel" class="ovl"><div class="panelCard"><div class="pTitle" id="pTitle"></div><div id="pBody"></div>
  <button class="mbtn" id="pClose" style="margin-top:18px">关 闭</button></div></div>

<div id="title" class="ovl show">
  <div class="fish">🐟</div>

 read:{n:()=>"📖 研读《孙子兵法》",d:()=>"灯下苦读，有机会悟得谋略卡",
  run:(s,W)=>{const missing=Object.keys(CARDS).filter(k=>s.cards[k]===undefined);
   if(missing.length&&Math.random()<0.6){const k=missing[Math.floor(Math.random()*missing.length)];s.cards[k]=true;
    return{fx:{heart:1},log:"灯下苦读，悟得谋略卡「"+CARDS[k].n+"」！"};}
   if(!missing.length)return{fx:{heart:2,rep:1},log:"六篇融会贯通——兵法的尽头，是人心。"};
   return{fx:{heart:1},log:"读了几页，心静了不少。"};}},
 friends:{n:()=>"🤝 结交场面人",d:()=>"饭局、烟、人情债",
  run:(s,W)=>({fx:{con:2+Math.floor(Math.random()*3),risk:1},log:"人脉是走出来的，也是喝出来的。"})},
 clean:{n:(s,W)=>W.mult===1?"🧹 给管理员送烟":"🧹 打点上下关系",d:(s,W)=>"花点小钱，压一压风声",
  run:(s,W)=>{const cost=300*W.mult;return{fx:{money:-cost,risk:-(2+Math.floor(Math.random()*3))},log:"打点完毕，风声松了些。（花 "+fmtMoney(cost)+"）"};}},
 family:{n:(s,W)=>"🏠 陪陪家人",d:(s,W)=>"陪"+AFF[W.fam].n+"吃顿热饭",
  run:(s,W)=>{const f={heart:2};f["aff"+cap(W.fam)]=3;return{fx:f,log:"家的灯亮着，人就还没走远。（"+AFF[W.fam].n+" 好感 +3）"};}},
 hustle:{n:(s,W)=>W.mult===1?"🌊 多摆两个钟头的摊":"🌊 拓张新门路",d:(s,W)=>W.mult===1?"多挣一点，也累一点":"新地盘意味着新的盯梢",
  run:(s,W)=>W.mult===1?{fx:{money:300,rep:1},log:"秤高一点，人熟一点。"}:{fx:{money:80000*W.mult,rep:2,risk:1},log:"版图又大了一圈，盯你的人也是。"}}
};

const S={

/* ---------- 第一章 2000 · 旧厂街 ---------- */
c1_1:{ch:"第一章 · 2000年 旧厂街",chTag:"第一章 · 2000年 旧厂街",bg:"bg-market",deco:"🐟",
 lines:[
  ["me","2000年，京海市，旧厂街菜市场。凌晨三点的白炽灯下，鱼池的水汽混着腥味，漫过整条街。"],
  ["qiang","两斤半的花鲢，拿好。下回给我送过来就行——这条街上谁不认识我，旧厂街卖鱼的高启强。"],
  ["qin","爹妈走得早。那年我十三岁，一手拉扯着弟弟启盛、妹妹启兰。这条鱼摊，就是全家的命。"],
  ["xh","哟——高老板，生意不错啊。这个月的『卫生费』，两百块。"]],next:"c1_2"},
c1_2:{bg:"bg-market",deco:"🐟",
 lines:[
  ["xl","小虎，跟他说什么呢。高老板是明白人，对吧？这钱交得痛快点，咱们兄弟以后多照应你。"],
  ["qin","什么卫生费。这条街谁都清楚，交的是买路钱。"]],next:"c1_2c"},
c1_2c:{bg:"bg-market",deco:"🐟",
 lines:[
  ["qin","兜里就剩下给启盛凑学费的钱。秤被踩坏过，电视被搬走过，我忍了。今天呢？"]],
 choices:[
  {t:"忍气吞声，把钱递过去",fx:{money:-200,heart:2},note:"初心 +2",next:"c1_3"},
  {t:"据理力争：『市场管理费我交过，凭什么再交？』",fx:{rep:3,heart:-2},next:"c1_2f"},
  {t:"一声不吭，把这笔账记在心里",fx:{con:3},set:{jichou:true},note:"人脉 +2",next:"c1_3"}]},
c1_2f:{bg:"bg-station",deco:"🚨",
 lines:[
  ["xh","哟嗬，翅膀硬了？兄弟们，把这台电视搬回去——就当他交的！"],
  ["qiang","你们……你们这是抢劫！"],
  ["me","年三十，旧厂街派出所。你攥着一份笔录，外头鞭炮响成一片，屋里只有一盏白炽灯。"]],next:"c1_4"},
c1_3:{bg:"bg-station",deco:"🚨",
 lines:[
  ["me","腊月二十九，你去派出所报电视被砸的事，话没说完，反倒被扣下来『协助调查』。年三十夜里，你就蹲在值班室的角落。"],
  ["qiang","（大过年的……启盛启兰还在家里等我包饺子。）"]],next:"c1_4"},
c1_4:{bg:"bg-station",deco:"👮",
 lines:[
  ["an","大过年的，怎么蹲在这儿？来，先吃口热的——食堂买的饺子，猪肉白菜馅，还温着。"],
  ["qiang","警察同志，我真是冤枉的……我一个卖鱼的，他们收钱砸东西，警察来了我先进了局子。"],
  ["an","电视的事我记下了，明天我陪你回市场，一件一件跟他们把理讲清楚。旧厂街的事，不会因为你没背景就没人管。"],
  ["qin","那天夜里的饺子，是我这些年吃过最暖的一口饭。后来很多年我都在想，如果当时……算了，先吃饺子。"]],
 choices:[
  {t:"把苦水都倒给他：『安警官，这日子真没盼头了。』",fx:{heart:4,rep:2,affAn:4},note:"初心 +4",next:"c1_5"},
  {t:"咬着牙逞强：『没事，我扛得住，习惯了。』",fx:{heart:-2,rep:4,affAn:3},note:"声望 +4",next:"c1_5"},
  {t:"反问他：『你当警察，一个月挣多少？值吗？』",fx:{con:3,heart:2,affAn:4},note:"人脉 +3",next:"c1_5"}]},
c1_5:{bg:"bg-station",deco:"📖",
 lines:[
  ["an","临走前给你留个东西。别总跟人瞪眼动手，多读点书——《孙子兵法》，我上大学时最爱的一本，借你。"],
  ["an","还有我的名片。再有人欺负你，先讲理；讲理不行，就打电话给我。记住，法律站在你这边。"],
  ["qiang","安欣……安警官，这书我一定好好读。"],
  ["me","【获得物品：《孙子兵法》】【获得物品：安欣的名片】"]
 ],set:{sunzi:true,card:true},fx:{heart:3,affAn:4},next:"c1_5b"},
c1_5b:{bg:"bg-market",deco:"🐟",
 lines:[
  ["lan","哥，电视拿回来了？我在学校听说了……你现在每天收摊那么晚，身体熬不住的。"],
  ["qiang","没事，哥壮实着呢。你只管念你的医学院，家里有我。"],
  ["qin","启兰懂事的让人心疼。这个家，我必须撑住。"]],fx:{affLan:3},next:"c1_6"},
c1_6:{bg:"bg-market",deco:"🕶️",
 lines:[
  ["sheng","哥，卖鱼到什么时候是个头？我一个大学生，看杂书看了一脑子生意经，咱不能一辈子被人踩在脚底下。"],
  ["qin","启盛聪明，胆子更大。聪明是刀，胆子是手，握不好就要见血。"]],
 choices:[
  {t:"敲他脑门：『书念好，别的少想。』",fx:{heart:4,affSheng:3},note:"初心 +4",next:"c1_7"},
  {t:"沉默。他说的，难道不对吗",fx:{heart:-2,affSheng:1},next:"c1_7"},
  {t:"『等哥读完这本兵法，带你看点不一样的。』",fx:{con:4,rep:2,affSheng:4},set:{sheng_amb:true},note:"人脉 +4",next:"c1_7"}]},
c1_7:{bg:"bg-rain",deco:"🌩️",
 lines:[
  ["me","开春的一个雨夜。市场里早没了人，鱼池的增氧泵嗡嗡响。忽然，有两个影子翻进了市场。"],
  ["me","是城里徐家的小少爷徐雷，喝多了，晃到鱼池边上，跳下去扑腾水玩。池边配电箱漏电，他一头栽进水里，抽搐了两下——就不动了。"],
  ["qiang","我离他只有三步。伸手，拉他，配电箱就在我手边，我能断电的。可我僵在那儿，腿像灌了铅。"],
  ["xl","高老板，今晚谁都没来过市场。听见没有？谁、都、没、来、过。徐家找不着人，你我都干净。"],
  ["qin","人没了。压在我心口的，不是怕，是我那三步没迈出去。"]],
 choices:[
  {t:"天亮以后，去找安欣，把看见的原原本本说清楚",fx:{heart:8,risk:4},note:"初心 +8，风险 +4",next:"c1_8"},
  {t:"听唐家兄弟的，烂在肚子里",fx:{risk:12,heart:-6},note:"风险 +12",next:"c1_8"},
  {t:"反过来拿住唐家兄弟：这事你俩也在场，一条船上了",fx:{con:6,risk:16,heart:-8},set:{tongmou:true},note:"人脉 +6，风险 +16",next:"c1_8"}]},
c1_8:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","半个月后，一张烫金请帖塞进鱼摊：白金瀚夜总会，徐老板请你喝茶。"],
  ["xu","高启强。旧厂街的高启强。我儿子的命，没在你那鱼池里，我派人查了二十遍。你说说，你一个卖鱼的，那天晚上到底看见什么了？"],
  ["qin","他眼睛是红的。丧子的人，刀架在你脖子上都不解恨。"]],
 choices:[
  {t:"『扑通』跪下：徐老板饶命，我真的什么都没看见",fx:{rep:-10,heart:-6},set:{guiguo:true},note:"声望 -10",next:"c1_9"},
  {t:"一句不说，硬扛着他的目光",fx:{heart:-2,rep:4},note:"声望 +4",next:"c1_9"},
  {t:"翻开《孙子兵法》的底子：『徐老板，配电箱漏电，电工的检修记录我抄了一份。您要真凶，先查电。』",req:{stat:"con",min:8},fx:{con:6,rep:8,risk:6},note:"人脉 +6 声望 +8",next:"c1_9"}],
 cardOpts:{mantian:{t:"顺着他的话，把『查电』的差事应下来——拖字诀走起",fx:{risk:-8,rep:2},next:"c1_9"}}},
c1_9:{bg:"bg-rain",deco:"🔪",
 lines:[
  ["me","茶没喝完，事情就来了。当夜，四条汉子堵了鱼摊，铁棍敲得案板梆梆响：徐老板说了，鱼摊明天就别开了。"],
  ["qin","手边有杀鱼刀，案板上还有半条冻得梆硬的带鱼。命，和往后二十年的路，都在这一下。"]],
 choices:[
  {t:"拎起冻鱼，跟他们拼了！",fx:{rep:10,risk:12,heart:-8},set:{eming:true},note:"声望 +10 风险 +12",next:"c1_10"},
  {t:"抄起名片打给安欣，死死守住电话不挂",fx:{heart:6,risk:-6,rep:2},note:"初心 +6 风险 -6",next:"c1_10"},
  {t:"把攒的五千块钱全推过去，破财消灾",fx:{money:-5000,heart:-4},note:"资金 -5000",next:"c1_10"}]},
c1_10:{bg:"bg-market",deco:"🌅",
 lines:[
  ["me","那条街还是那条街。鱼还是要进，秤还是要摆。可旧厂街的人再看你，眼神不一样了。"],
  ["qin","风浪来过了。有人被浪打翻，有人学会了踩着浪走。我想做后一种。"]],
 choices:[
  {t:"本本分分卖鱼，供弟妹读完书，别的不沾",fx:{heart:8,rep:2,money:1000},set:{anfen:true},note:"初心 +8",next:"c1_chk"},
  {t:"提两瓶好酒，去拜泰叔的码头，想活得好就得有人罩着",fx:{con:8,risk:8,rep:4,money:-1000},note:"人脉 +8 风险 +8",next:"c1_chk"},
  {t:"拉上启盛倒腾电器BB机，做生意攒本钱",fx:{money:3000,con:3,rep:2},note:"资金 +3000",next:"c1_chk"}]},
c1_chk:{hidden:true,route:s=>s.risk>=70?"g_rain":"w1",alt:["g_rain","w1"]},
w1:{wave:"w1",next:"c2_1a"},

/* ---------- 第二章 2006 · 风起于萍末 ---------- */
c2_1a:{era:{y:"第 二 章 · 二 ○ ○ 六",t:"风起于萍末",s:"白金瀚的霓虹，比鱼市的白炽灯亮得多，也烫得多。",chap:2},next:"c2_1"},
c2_1:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["me","六年，弹指一挥。旧厂街的鱼摊变成了水产档口，你的名字在京海的水产圈里有了分量。这一年，两个女人一个男人，先后走进你的命里。"],
  ["sao","高老板，坐。听说徐江的人为难你？我是陈书婷，白家的当家人。京海地面上的事，轮不到他一个人说了算。"]],next:"c2_2"},
c2_2:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","我这人不喜欢绕弯子。白金瀚、白家的场子，缺一个能压得住场面的人。你敢不敢接？"],
  ["qin","她递过来的不是酒杯，是一把椅子。接，还是不接。"]],next:"c2_2b"},
c2_2b:{bg:"bg-market",deco:"🔪",
 lines:[
  ["me","菜场西口，一个刚出狱的男人守着个修车摊，被人掀了摊子也不还手。你认得他——老默，当年进去了几年，出来老婆没了，就剩一个闺女。"],
  ["mo","高老板。不用可怜我。我就是……想给丫丫挣个学费。"],
  ["qin","这人眼里有一种东西，像深海里的鱼，不出声，但知道往哪儿游。"]],
 choices:[
  {t:"『西口那个摊位归你。往后你跟我，我养你们父女。』",fx:{heart:6,con:5,affMo:8},set:{laomo:true},note:"初心 +6 人脉 +5",next:"c2_3"},
  {t:"雇他看场子，但钱按行价再压三成——便宜好用",fx:{con:6,heart:-4,affMo:4},set:{laomo:true},note:"人脉 +6",next:"c2_3"},
  {t:"点头致意，各过各的日子",fx:{heart:2,affMo:1},note:"初心 +2",next:"c2_3"}]},
c2_3:{bg:"bg-jinhan",deco:"🐺",
 lines:[
  ["me","徐江的时代到头了。线人反水、账本外流、白金瀚的股东连夜撤资，他成了京海人人都想踩一脚的落水狗。今夜，他孤身来见你。"],
  ["xu","高启强！成王败寇，我认。但京海这么大，你就不怕我姓徐的哪天缓过来，再跟你算今天的账？"],
  ["qin","他身后已经没有兄弟了。可饿狼就是饿狼。"]],
 choices:[
  {t:"递给老默一根烟：『告诉老默，我想吃鱼了。』",req:{flag:"laomo"},fx:{rep:12,risk:14,heart:-10},set:{xuezhai1:true},note:"声望 +12 风险 +14",next:"c2_4"},
  {t:"连夜把他和账目一起送到安欣手里，交由法律发落",fx:{heart:10,risk:-8,rep:6},note:"初心 +10 风险 -8",next:"c2_4"},
  {t:"放他离开京海：『我高启强不斩落水狗。』",fx:{rep:-4,risk:8,heart:2},set:{fanghu:true},note:"风险 +8",next:"c2_4"}],
 cardOpts:{jiedao:{t:"把徐江仇家的名单，递给急着上位的人",fx:{rep:10,con:4,heart:-8,risk:4},next:"c2_4"}}},
c2_4:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","泰叔的寿宴。满堂宾客里，老爷子招手让你过去，把一根不离手的枣木拐杖放在你面前。"],
  ["tai","启强啊。这根拐杖，我拄了三十年，京海没人敢扶。今天你扶一下试试？"],
  ["qin","满场的人都盯着。这一扶，就是他陈泰的人了。"]],next:"c2_5"},
c2_5:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["qin","扶，还是不扶。"]],
 choices:[
  {t:"双膝跪地，端茶认干爹：『爹在上，受儿子一拜。』",fx:{con:12,rep:6,heart:-8},set:{taishu:true},note:"人脉 +12 声望 +6",next:"c2_5b"},
  {t:"不跪。双手抱拳，只把拐杖扶正放好：『叔，我敬您，但跪不下去。』",fx:{rep:10,con:4},set:{yinggutou:true},note:"声望 +10",next:"c2_5b"}],
 cardOpts:{fanke:{t:"不跪也不接——反手把白金瀚三成干股的协议推到泰叔面前",fx:{rep:14,con:8,heart:-2},set:{pingdeng:true},next:"c2_5b"}}},
c2_5b:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","高启强，跟着你这几年，我看得明白：你这个人，心里有一杆秤。我的场子，我这个人，你敢不敢一起接？"],
  ["qin","大嫂笑了。京海谁不知道，能得到陈书婷一句『敢』，半个白金瀚就姓了高。"]],
 choices:[
  {t:"『娶。这辈子，高启强明媒正娶。』",fx:{rep:8,heart:4,affSao:8},set:{marry:true},note:"声望 +8",next:"c2_6"},
  {t:"『书婷，我现在满手是泥，配不上你。等我洗干净……』",fx:{rep:-6,heart:6,affSao:3},note:"初心 +6",next:"c2_6"}]},
c2_6:{bg:"bg-tower",deco:"🕶️",
 lines:[
  ["me","这一年，启盛的小灵通柜台开进了三家商场。他站在柜台后面给人家讲『信号增强专利』，眼睛亮得吓人。"],
  ["sheng","哥，柜台叫什么名字，我想好了——就叫『强盛』。强的强，盛的盛。咱高家，从此往上走！"],
  ["qin","强盛。鱼摊的名字跟着我们二十年了，从今天起，它有了新的意思。"]],
 choices:[
  {t:"把全部积蓄押进去，兄弟俩合伙干",fx:{money:-20000,rep:8,con:6,affSheng:4},set:{qiangsheng:true},note:"资金 -20000 声望 +8",next:"c2_7"},
  {t:"只出面子不出钱：『哥给你站台，账你自己管。』",fx:{rep:4,con:3,affSheng:3},set:{qiangsheng:true},note:"声望 +4",next:"c2_7"},
  {t:"劝他收手：『小灵通火不了几年，安安稳稳比什么都强。』",fx:{heart:6,rep:-4,affSheng:2},note:"初心 +6",next:"c2_7"}]},
c2_7:{bg:"bg-jinhan",deco:"🌃",
 lines:[
  ["me","2006年冬天，『强盛商贸有限公司』挂牌。鞭炮屑落满门口，像一场红色的雪。"],
  ["me","泰叔老了，白金瀚的钥匙一点点挪进你口袋。京海的人提起高启强，不再说『卖鱼的』，而是压低声音说——『强哥』。"]],
 choices:[
  {t:"接下他递来的烟，陪他在天台看一夜的京海",fx:{rep:4,con:4,risk:4},note:"声望 +4 人脉 +4",next:"c2_chk"},
  {t:"把烟掐了：『叔，烟伤肺。咱们讲生意。』",fx:{rep:6,heart:2},note:"声望 +6",next:"c2_chk"}]},

/* ---------- 第三章 2015 · 京海之巅 ---------- */
c3_1a:{era:{y:"第 三 章 · 二 ○ 一 五",t:"京海之巅",s:"强盛大厦六十六层，整面落地窗外，就是整个京海。",chap:3},next:"c3_1"},
c3_1:{bg:"bg-tower",deco:"🏙️",
 lines:[
  ["me","2015年。强盛集团总部大楼落成，66层，京海第三高楼。剪彩那天的红绸，比当年鱼摊的塑料袋贵一万倍。"],
  ["me","地产、商贸、娱乐、物流——集团的版图铺满京海。你站在顶层落地窗前，脚下是车流，是灯火，是你从鱼摊一步一步走上来的这座城。"],
  ["qin","风浪越大，鱼越贵。这句话，我用了十五年。"]],next:"c3_2"},
c3_2:{bg:"bg-tower",deco:"🎩",
 lines:[
  ["me","深夜，一辆黑色轿车停进地下车库。市委常委、政法委书记赵立冬的秘书递来一份文件。"],
  ["zhao","高总，强盛能长这么大，靠什么，你心里有数吧。市里项目要做优做大，你这两成干股，就是投名状。往后你的事，就是我的事。"],
  ["qin","官帽比黑金可怕，也比黑金好使。可这东西一旦接了，就再没有回头路。"]],
 choices:[
  {t:"签字，递干股。这把伞，不要白不要",fx:{con:12,risk:18,heart:-12},set:{sanhu:true},note:"人脉 +12 风险 +18",next:"c3_3"},
  {t:"虚与委蛇：『赵书记，容我先做做股东们的思想工作。』",fx:{con:4,risk:8},note:"风险 +8",next:"c3_3"},
  {t:"当场拒绝，顺手把录音笔留在了茶几上",fx:{risk:20,heart:6},set:{babing:true},note:"风险 +20 初心 +6",next:"c3_3"}],
 cardOpts:{jinchani:{t:"假意应承，把干股挂进三家空壳公司里",fx:{con:6,risk:4},next:"c3_3"}}},
c3_3:{bg:"bg-rain",deco:"🌩️",
 lines:[
  ["me","莽村的旧厂改造，村民堵了强盛的工地三个月。谈判那天，李宏伟带着人掀了桌，泼了启盛一身茶。"],
  ["me","三天后，李宏伟被发现死在冷库，凶器——是一条冻鱼。启盛坐在审讯室里，眼镜碎了，笑得很平静。"],
  ["sheng","哥，我替你把脏活干了。你说过，风浪越大，鱼越贵。"],
  ["qin","我什么时候让你去杀人了！……启盛是我弟弟。这一步怎么落，落下去就再也收不回来。"]],
 choices:[
  {t:"动用一切关系把案子压下来。弟弟，哥保",fx:{risk:18,con:8,heart:-14},set:{xuezhan:true},note:"风险 +18 人脉 +8",next:"c3_4"},
  {t:"连夜送启盛去自首。大义灭亲，哥陪你一起担",fx:{heart:14,rep:-8,risk:-10},set:{dayi:true},note:"初心 +14 风险 -10",next:"c3_4"},
  {t:"花大钱送他出国，永远别回来",fx:{money:-2000000,risk:8,heart:-6},set:{chuguo:true},note:"资金 -200万",next:"c3_4"},
  {t:"在审讯室外陪他坐了一整夜，一句话不说",req:{aff:"sheng",min:70},fx:{heart:8,affSheng:8},note:"初心 +8",next:"c3_4"}],
 cardOpts:{yiyi:{t:"按兵不动，停工耗到莽村自己内讧",fx:{risk:-6,rep:2,heart:2},next:"c3_4"}}},
c3_4:{bg:"bg-rain",deco:"👮",
 lines:[
  ["me","深秋雨夜。旧厂街拆迁后的空地上，你看见一个白头发的男人站在路灯下——安欣。二十年，他把头发熬白了，人瘦得像一根警徽上的钢针。"],
  ["an","高启强。二十年前除夕，你在这儿卖鱼，我在值班室给你买过一份饺子。二十年，你从鱼摊走到了六十六层。我就想问问你——值吗？"],
  ["qin","他不是来抓我的。他是来接我回家的。可回哪个家？"]],
 choices:[
  {t:"『安欣，回头吧，你斗不赢整个京海。』",fx:{heart:-4,con:2,affAn:-2},note:"初心 -4",next:"c3_5"},
  {t:"『我们本可以做一辈子朋友。是我自己选了另一条路。』",fx:{heart:8,affAn:5},set:{liangzhi:true},note:"初心 +8",next:"c3_5"},
  {t:"把一份赵立冬的罪证线索，悄悄推到他脚边",req:{flag:"babing"},fx:{heart:12,risk:-6,affAn:6},set:{anxin_xiansuo:true},note:"初心 +12 风险 -6",next:"c3_5"},
  {t:"握住他的手：『安欣，如果我先伸手，你还接吗？』",req:{aff:"an",min:70},fx:{heart:10,affAn:8},set:{liangzhi:true},note:"初心 +10",next:"c3_5"}]},
c3_5:{bg:"bg-jinhan",deco:"🔪",
 lines:[
  ["me","地下车库。老默拉开车门坐进来，像每一次那样，先给丫丫的家教费报了账。然后他压低声音。"],
  ["mo","强哥。安欣的住址、巡逻班次，都摸清了。您一句话——今晚，吃鱼吗？"],
  ["qin","车里静得能听见心跳。老默的手，稳得像二十年前那个修车摊。"]],
 choices:[
  {t:"『老默，把名单烧了。安欣，不许动。』",fx:{heart:12,con:2},set:{baoanxin:true},note:"初心 +12",next:"c3_6"},
  {t:"沉默十秒，说：『按你的想法办。』",fx:{heart:-18,risk:14},set:{xuezhai2:true},note:"初心 -18 风险 +14",next:"c3_6"}]},
c3_6:{bg:"bg-tower",deco:"🎀",
 lines:[
  ["me","又是几年。大嫂走的那天，京海下了很大的雨。从那以后，陪你吃饭的人，只剩下瑶瑶。"],
  ["yao","爸。我整理了书房，发现一个上锁的抽屉……我没开。我只是想问，咱家的钱，都是干干净净的吗？"],
  ["qin","她眼里有大嫂的影子。她要是干净，就让她干净到底。"]],
 choices:[
  {t:"教她看报表、管账目——黄家的女儿，要接得住盘子",fx:{con:6,rep:4,affYao:5},note:"人脉 +6",next:"w3"},
  {t:"『瑶瑶，听话。这个抽屉，永远别打开。毕业后离开京海。』",fx:{heart:10,affYao:6},set:{yaogan:true},note:"初心 +10",next:"w3"},
  {t:"什么也不说，只是摸了摸她的头",fx:{heart:2,affYao:3},next:"w3"}]},
w3:{wave:"w3",next:"c3_chk"},

/* ---------- 第四章 2021 · 潮水退去 ---------- */
c4_1a:{era:{y:"第 四 章 · 二 ○ 二 一",t:"潮水退去",s:"教育整顿驻点指导组进驻京海。潮水退去的时候，才知道谁在裸泳。",chap:4},next:"c4_1"},
c4_1:{bg:"bg-rain",deco:"📋",
 lines:[
  ["me","2021年。中央教育整顿驻点指导组进驻京海，组长徐忠。指导组的车子碾过雨水，停在强盛大厦楼下那天，整座城市都听见了。"],
  ["me","唐小龙被带走的那晚，强盛大厦的灯一盏一盏熄灭。京海的报纸用了一个词——『收网』。"]],
 choices:[
  {t:"紧急召开家族会议，商量对策",next:"c4_2"}]},
c4_2:{bg:"bg-rain",deco:"🎩",
 lines:[
  ["me","电视里，赵立冬戴着手铐走下警车。镜头扫过，他忽然朝镜头笑了笑——所有人都知道那个笑是什么意思。"],
  ["xz","高启强同志，指导组这里，有一份1996年到2021年的清单，越来越长。我们是来听你说的，不是来抓你——今天。"]],
 choices:[{t:"静观其变，等指导组先出牌",fx:{heart:1},next:"c4_3"}],
 cardOpts:{yuanjiao:{t:"抢先向指导组交出赵立冬的罪证，变被动为主动",fx:{risk:-10,heart:4},set:{tanzhu:true},next:"c4_3"}}},
c4_3:{bg:"bg-cell",deco:"🎀",
 lines:[
  ["me","深夜，书房。黄瑶坐在你对面，桌上摆着一个打开的抽屉，和一本泛黄的账本。"],
  ["yao","爸。账本我全看完了。白叔的事、徐江的事、启盛叔的事……我抱着它坐了一整夜。指导组的人说，你可以选。"],
  ["qin","我养大的姑娘，替我打开了最后一个抽屉。这一夜，谁都别想再骗自己了。"]],
 choices:[
  {t:"抢过账本，塞进壁炉。烧了它，烧了就干净了",fx:{heart:-16,risk:6,affYao:-8},set:{shaozhang:true},note:"初心 -16",next:"c4_4"},
  {t:"把账本推到她面前：『瑶瑶，交出去。这是爸最后能做的事。』",fx:{heart:16,affYao:8},set:{renzui:true},note:"初心 +16",next:"c4_4"},
  {t:"安排她当晚出国：『账在爸这儿，跟你没关系。』",fx:{heart:8,rep:4,affYao:4},set:{yaogan:true},note:"初心 +8",next:"c4_4"},
  {t:"把 1996 年以来的事，原原本本讲给她听",req:{aff:"yao",min:60},fx:{heart:12,affYao:6},set:{truth:true},note:"初心 +12",next:"c4_4"}]},
c4_4:{bg:"bg-cell",deco:"🥟",
 lines:[
  ["me","最后见安欣，是在强盛大厦的顶层。没有手铐，没有审讯室。他带了一份打包的饺子，放在桌上，像二十年前那个除夕。"],
  ["an","高启强，最后一面。徐忠组长让我带一句话：指导组的门开着，路的另一头，还是那条旧厂街。"],
  ["qin","我看着他。二十年前他递给我饺子的时候，我是京海最穷的人；今天他递给我筷子，我还是。绕了二十年，原来最贵的从来不是鱼。"]],
 choices:[
  {t:"『我跟你走。先去旧厂街，再看一眼鱼摊。』——自首",next:"end_route"},
  {t:"『我高启强这辈子，没输过。要抓我，让你的人进来拿。』——鱼死网破",next:"e_chaos"},
  {t:"当夜坐渔船出海：『风浪越大，鱼越贵。』——跑路",next:"e_run"}]},

/* ---------- 结局 ---------- */
end_route:{hidden:true,route:s=>{
  if(s.set.shaozhang) return "e_burn";
  if(s.heart>=60&&(s.set.liangzhi||s.aff.an>=75)) return "e_newlife";
  if(s.rep>=70) return "e_peak";
  return "e_tide";},alt:["e_burn","e_newlife","e_peak","e_tide"]},

e_tide:{ending:{id:"tide",name:"潮 退",text:"你跟着安欣走出大厦，在旧厂街的拆迁废墟前站了很久。当年鱼摊的位置，如今是一块平整的水泥地。\n\n判决下来那天，京海下了场大雨。法庭最后陈述，你只说了一句：『我这一辈子，最对不起的人是安欣，最想回去的，是2000年的那个鱼摊。』\n\n潮水退去，人们说你曾经站上京海之巅。只有你自己知道，从举起那条冻鱼开始，你就已经开始往下走了。"},
 fates:[["安欣","守着那碗饺子的约定，看着你走进高墙"],["高启盛","（结局随你的选择而不同）"],["黄瑶","在指导组的护送下，开始了普通人的生活"]]},
e_peak:{ending:{id:"peak",name:"京海之王 · 梦 醒",text:"你曾拥有过整座京海：六十六层的楼、全城的敬畏、说一不二的二十年。\n\n宣判那天，旁听席坐满了人。记者数过，你涉案的卷宗摞起来一米八高——正好是你从鱼摊『长』出来的高度。\n\n铁窗内，你常常梦见凌晨三点的菜市场。梦里你永远是那个数着零钱、给弟弟妹妹买排骨的卖鱼佬。醒来才发现，京海之王，原来是一场二十年的大梦。"},
 fates:[["强盛集团","资产冻结清算，大厦换了招牌"],["旧部","树倒猢狲散，再没人喊你『强哥』"],["安欣","把《孙子兵法》还给了你——当年他借你的那本"]]},
e_newlife:{ending:{id:"newlife",name:"回 头 是 岸",text:"你选择了最难的那条路：交代一切，检举立功，把二十年的账一笔一笔还清。\n\n因为重大立功，判决书比所有人预想的仁慈。高墙内你学会了种菜、识字教书，给年轻犯人讲《孙子兵法》——只讲『慎战』那一章。\n\n安欣来看过你几次，每次都带一份猪肉白菜馅的饺子。他说：『高启强，你终于考上了你当年想考的那所学校——法律，是最后一课。』"},
 fates:[["高启盛","（你当年守住了底线，他一直记得）"],["高启兰","每个月都来看你，白大褂口袋里装着家里的照片"],["安欣","终于睡了个整觉，京海的天亮了"]]},
e_chaos:{ending:{id:"chaos",name:"鱼 死 网 破",text:"你说你没输过。可这一夜，指导组的收网圈从楼下一层层合上来，像二十年前那张网住整条街的渔网。\n\n天台上，你最后看了一眼京海的灯火。安欣踩着水走上天台，喊的却是：『高启强！回头！』\n\n风浪越大，鱼越贵——可浪太大了，船是会翻的。你终究没能再赢一次。"},
 fates:[["高启强","数罪并罚，再无上诉"],["京海","报纸头版：盘踞二十年的毒瘤，连根拔起"],["老默","（若你曾许他安稳，他终究只是个修车的父亲）"]]},
e_run:{ending:{id:"run",name:"亡 命 南 洋",text:"渔船在公海上漂了十一天。你以为逃出了那张网，却发现自己从没离开过——护照是假的，钱是冻的，船老大接的，本来就是国际刑警的单子。\n\n引渡回国那天，舷梯下站着白头发的安欣。你笑了：『我就知道，会是你来接我。』\n\n后来狱里有人问你后不后悔。你说：跑了十一天才明白，海再大，也没有一寸是卖鱼人的退路。"},
 fates:[["黄瑶","留在京海，每年替你去旧厂街看一眼"],["高启兰","等了你十一年"],["安欣","案卷最后一页，他签下自己的名字"]]},
e_burn:{ending:{id:"burn",name:"灰 烬",text:"账本烧掉的那个晚上，你以为烧掉的是证据。其实烧掉的，是你最后一丝从轻的可能。\n\n指导组拿出了备份——黄瑶早就扫描存档了。数罪并罚，顶格量刑。法庭上你反复念叨一句话：『烧了，都烧了……』\n\n没有人接话。灰烬里什么都没有，包括回头路。"},
 fates:[["黄瑶","把账本交了出去——她替你选择了坦白"],["安欣","收队那天，他没有回头看你"],["旧厂街","拆迁废墟上，新的菜市场已经动工"]]},
g_rain:{ending:{id:"rain",name:"旧厂街的雨 夜",text:"风声太紧，你欠的债太多。一个再普通不过的雨夜，鱼池的水泵还在响，你却再也没能等到天亮收摊。\n\n菜市场第二天照常开门。人们叹一句『卖鱼的老高没了』，然后各自守着自己的一池鱼。\n\n在这个世界，你只是旧厂街一个没熬过风浪的鱼贩子。也许，这才是最干净的一种结局。"},
 fates:[["高启盛","把你的鱼摊守了三年，最终还是走了别的路"],["高启兰","医学院毕业，白大褂口袋里总装着一枚鱼钩"],["安欣","案卷上写着：被害人，高启强"]]},
g_gun:{ending:{id:"gunshot",name:"白金瀚的枪 声",text:"场子越做越大，仇家越结越多。你终于明白徐江当年为什么总是眯着眼笑——坐在那样的位置上，四面八方都是枪口。\n\n那晚白金瀚灯火通明，你举杯的手停在半空。\n\n江湖上的事，来得多快，去得就多快。京海之巅的台阶，原来每一级都是悬崖。"},
 fates:[["陈书婷","连夜带着孩子们离开了京海"],["京海","白金瀚重新挂了招牌，换了个姓"],["安欣","他在你的案卷扉页写：他本可以是个好人"]]},
g_net:{ending:{id:"net",name:"提 前 收 网",text:"你把手里的网张得太大，太密，太狠——大到指导组还没进京海，就先看见了你的网。\n\n收网那天清晨，六十六层的办公室里，你被自己的脚步声惊醒。楼梯上不来，电梯下不去。\n\n你比故事里那个高启强，更早地触碰到了网沿。"},
 fates:[["强盛集团","一夜之间查封"],["京海","第二天报纸头版：人民的城市，容不下第二张网"],["黄瑶","被安欣送出了京海，从此再没回来过"]]}

};

/* ================= 音效 ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC;}
function beep(f,d,type,vol){if(!snd)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();
 o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||.05;o.connect(g);g.connect(a.destination);
 o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d);}catch(e){}}
const sfxTick=()=>beep(920,.03,"square",.012);
const sfxOk=()=>{beep(520,.09,"sine",.05);setTimeout(()=>beep(780,.12,"sine",.05),80)};
const sfxBad=()=>{beep(180,.2,"sawtooth",.04)};
const sfxBig=()=>{beep(330,.15,"sine",.06);setTimeout(()=>beep(440,.15,"sine",.06),120);setTimeout(()=>beep(660,.25,"sine",.06),240)};
$("sndBtn").onclick=()=>{snd=!snd;$("sndBtn").textContent=snd?"🔊 音效":"🔇 静音";};

/* ================= 渲染 ================= */
function bgOf(id){const s=S[id];curBg=s.bg||"bg-market";$("bg").className="bg-"+curBg.replace("bg-","");$("deco").textContent=s.deco||"🐟";renderSceneArt();updateFigures();}
function hudChips(){
 $("c_money").innerHTML='💰 资金 <b>'+fmtMoney(st.money)+'</b>';
 $("c_rep").innerHTML='🐟 声望 <b>'+st.rep+'</b>';
 $("c_con").innerHTML='🤝 人脉 <b>'+st.con+'</b>';
 const r=$("c_risk");r.innerHTML='⚠️ 风险 <b>'+st.risk+'</b>';r.classList.toggle("warn",st.risk>=70);
 $("c_heart").innerHTML='❤️ 初心 <b>'+st.heart+'</b>';

 hudCards();
}
function flo(chip,txt,up){const d=document.createElement("span");
 d.className="flo "+(up?"up":"dn");d.textContent=txt;chip.appendChild(d);
 setTimeout(()=>d.remove(),1100);}
function applyFx(fx,el){
 if(!fx)return;const map={money:"c_money",rep:"c_rep",con:"c_con",risk:"c_risk",heart:"c_heart"};
 for(const k in fx){const v=fx[k];if(!v)continue;
  if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(st.aff[id]===undefined)continue;
   st.aff[id]=clamp(st.aff[id]+v);flo($("c_aff"),(v>0?"+":"")+v+" "+AFF[id].n,v>0);continue;}
  if(k==="money")st.money=Math.max(0,st.money+v);else st[k]=clamp(st[k]+v);
  flo($(map[k]),(k==="money"?((v>0?"+":"")+fmtMoney(v)):((v>0?"+":"")+v)),v>0);
  if(k==="risk"&&v>0)sfxBad();else if(v>0&&(k==="rep"||k==="heart"))sfxOk();}
 hudChips();
}
function setCh(id){const s=S[id];if(s&&s.ch){$("chTag").textContent=s.ch;}}
function showEra(era,next){
 $("eraY").textContent=era.y;$("eraT").textContent=era.t;$("eraS").textContent=era.s;
 $("chTag").textContent=era.y.replace(/\s+/g,"");
 if(era.chap)st.chap=era.chap;
 $("era").classList.add("show");sfxBig();
 $("eraGo").onclick=()=>{$("era").classList.remove("show");enter(next);};
}
function enter(id){
 if(!id||!S[id]){console.error("missing scene",id);return;}
 curId=id;const s=S[id];
 if(s.era){showEra(s.era,s.next);return;}
 if(s.wave){startWave(s.wave,s.next);return;}
 $("wave").classList.remove("show");$("panel").classList.remove("show");
 if(s.hidden&&s.route){enter(s.route(st));return;}
 bgOf(id);$("hud").style.display="flex";
 if(s.chTag)$("chTag").textContent=s.chTag;
 applyFx(s.fx);if(s.set)Object.assign(st.set,s.set);
 hudChips();
 checkAch();
 if(s.ending){showEnding(s);return;}
 saveGame();
 renderLines(s,0);
}
function renderLines(s,i){
 const choices=$("choices");choices.innerHTML="";
 if(i>=s.lines.length){
  if(s.choices){renderChoices(s);}else if(typeof s.next==="function"){enter(s.next(st));}
  else if(s.next){enter(s.next);}return;}
 const who=s.lines[i][0],txt=s.lines[i][1];
 const c=C[who]||C.me;
 if(who!=="me"&&who!=="qiang"&&who!=="qin")lastPartner=who;
 updateFigures();
 $("whoAv").textContent=c.e;$("whoAv").style.borderColor=c.c;
 setChibi(who);
 $("whoName").textContent=c.n;$("whoName").style.color=c.c;
 const tEl=$("txt");tEl.textContent="";$("hint").style.visibility="hidden";
 let p=0;clearInterval(typing);
 typing=setInterval(()=>{
  tEl.textContent=txt.slice(0,++p);
  if(p%3===0)sfxTick();
  if(p>=txt.length){clearInterval(typing);typing=null;$("hint").style.visibility="visible";}
 },26);
 clickHandler=()=>{if(typing){clearInterval(typing);typing=null;tEl.textContent=txt;$("hint").style.visibility="visible";}else renderLines(s,i+1);};
}
let clickHandler=null;
$("dlg").addEventListener("click",()=>{if(clickHandler)clickHandler();});
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&clickHandler){e.preventDefault();clickHandler();}});

function reqOk(req){if(!req)return true;if(req.flag&&!st.set[req.flag])return false;
 if(req.aff&&(st.aff[req.aff]||0)<req.min)return false;
 if(req.min&&req.stat&&st[req.stat]<req.min)return false;return true;}
function reqText(req){if(!req)return"";
 if(req.flag)return"需要：关键剧情线";
 if(req.aff)return"需要："+AFF[req.aff].n+" 好感 ≥ "+req.min;
 if(req.min)return"需要："+({rep:"声望",con:"人脉",heart:"初心",risk:"风险"}[req.stat])+" ≥ "+req.min;return"";}
function fxNote(fx){if(!fx)return"";const m={money:"资金",rep:"声望",con:"人脉",risk:"风险",heart:"初心",
 affAn:"安欣好感",affSheng:"启盛好感",affLan:"启兰好感",affSao:"大嫂好感",affMo:"老默好感",affYao:"瑶瑶好感"};
 return Object.keys(fx).filter(k=>fx[k]&&m[k]).map(k=>{const v=fx[k];return (k==="money"?((v>0?"+":"")+fmtMoney(v)):(v>0?"+":"")+v)+" "+m[k]}).join(" ");
}
function renderChoices(s){
 const box=$("choices");box.innerHTML="";
 let opts=(s.choices||[]).slice();
 if(s.cardOpts)for(const ck in s.cardOpts){if(st.cards[ck])opts.push(Object.assign({},s.cardOpts[ck],{card:ck}));}
 opts.forEach(ch=>{
  const ok=reqOk(ch.req);
  const b=document.createElement("button");b.className="choice"+(ok?"":" lock")+(ch.card?" cardOpt":"");
  const note=(ch.card?"打出「"+CARDS[ch.card].n+"」 · ":""+fxNote(ch.fx))||(ch.set?Object.keys(ch.set).map(k=>FLAG_NAMES[k]).filter(Boolean).join("、"):"");
  b.innerHTML='<span>'+ch.t+'</span>'+(note?'<span class="fx">'+(ok?"":"🔒 ")+note+'</span>':"");
  b.onclick=()=>{if(!ok){toast(reqText(ch.req));sfxBad();return;}
   sfxOk();if(ch.card){st.cards[ch.card]=false;toast("打出谋略卡「"+CARDS[ch.card].n+"」");}
   applyFx(ch.fx);if(ch.set)Object.assign(st.set,ch.set);checkAch();
   if(ch.route)enter(ch.route(st));else enter(ch.next);};
  box.appendChild(b);
 });
}
const FLAG_NAMES={sunzi:"《孙子兵法》",card:"安欣的名片",jichou:"记仇",tongmou:"同谋",guiguo:"跪过徐江",eming:"恶名",anfen:"本分",laomo:"老默的忠心",xuezhai1:"血债·徐江",fanghu:"放虎归山",taishu:"泰叔干爹",yinggutou:"硬骨头",marry:"娶了大嫂",qiangsheng:"强盛公司",sanhu:"保护伞",babing:"把柄",xuezhan:"双手沾血",dayi:"大义灭亲",chuguo:"启盛出国",liangzhi:"良知未泯",anxin_xiansuo:"暗线",baoanxin:"不杀安欣",xuezhai2:"血债·安欣线",yaogan:"瑶瑶干净",shaozhang:"销毁证据",renzui:"认罪伏法",sheng_amb:"启盛的野心"};

function grade(){
 const s=st;let v=s.heart*0.4+s.rep*0.2+s.con*0.2+(100-s.risk)*0.2;
 for(const[g,l,n]of GRADES)if(v>=g)return{g:l,n};return{g:"C",n:"挣扎"};
}

  '</span><span>⚠️ 风险 '+st.risk+'</span><span>❤️ 初心 '+st.heart+'</span><span>🏷 '+

/* ================= V2 引擎：风浪回合 ================= */
let waveNext=null;
function hudCards(){if(!st)return;$("c_cards").innerHTML="🃏 <b>"+Object.keys(st.cards).filter(k=>st.cards[k]===true).length+"</b>";}
function startWave(id,next){
 st.wave={id:id,turn:0};waveNext=next;
 $("wEra").textContent=WAVES[id].era;$("wLog").textContent="";
 $("wave").classList.add("show");renderWave();saveGame();
}
function renderWave(){
 const W=WAVES[st.wave.id];
 $("wTurn").textContent="第 "+(st.wave.turn+1)+" / "+W.turns+" 回合";
 $("evBox").style.display="none";
 const box=$("wActs");box.innerHTML="";
 W.acts.forEach(id=>{const a=ACTIONS[id];const b=document.createElement("button");b.className="wAct";
  b.innerHTML=a.n(st,W)+'<span class="wd">'+a.d(st,W)+'</span>';
  b.onclick=()=>doAction(a);box.appendChild(b);});
}
function doAction(a){
 const W=WAVES[st.wave.id];const res=a.run(st,W);
 applyFx(res.fx);$("wLog").textContent=res.log||"";st.wave.turn++;
 if(Math.random()<0.45&&W.evs.length){showEvent(W.evs[Math.floor(Math.random()*W.evs.length)]);}
 else nextTurn();
 saveGame();
}
function showEvent(ev){
 beep(300,.15,"triangle",.05);
 const box=$("evBox");box.style.display="";box.innerHTML='<div class="et">⚡ '+ev.t+'</div><div class="ed">'+ev.d+'</div>';
 $("wActs").innerHTML="";
 const btns=document.createElement("div");btns.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
 if(ev.ch){ev.ch.forEach(c=>{const b=document.createElement("button");b.className="wAct";b.style.flex="1";
  b.innerHTML=c.t+'<span class="wd">'+fxNote(c.fx)+'</span>';
  b.onclick=()=>{applyFx(c.fx);box.style.display="none";$("wLog").textContent=c.t;nextTurn();};btns.appendChild(b);});}
 else{const b=document.createElement("button");b.className="wAct";b.textContent="知道了";b.style.flex="1";
  b.onclick=()=>{if(ev.fx)applyFx(ev.fx);box.style.display="none";nextTurn();};btns.appendChild(b);}
 box.appendChild(btns);
}
function nextTurn(){
 if(st.wave.turn>=WAVES[st.wave.id].turns){finishWave();return;}
 renderWave();saveGame();
}
function finishWave(){
 const nx=waveNext;st.wave=null;$("wave").classList.remove("show");
 checkAch();enter(nx);
}
$("wSkip").onclick=()=>{if(!st||!st.wave)return;
 st.wave.turn=WAVES[st.wave.id].turns;toast("你草草应付了经营——风浪不会等人");finishWave();};

 if(!st)return;const got=achMap();

  if(ok){got[a.id]=1;LSset(KEY_ACH,JSON.stringify(got));
   st.achRun=(st.achRun||[]).concat(a.id);toast("🏆 成就解锁："+a.n);sfxBig();}});

function cont(){try{const s0=JSON.parse(LSget(KEY_SAVE));const f=fresh();
 f.set=Object.assign(f.set,s0.set||{});f.aff=Object.assign(f.aff,s0.aff||{});f.cards=Object.assign(f.cards,s0.cards||{});
 st=Object.assign(f,s0);st.node=s0.node||"c1_1";

/* ================= 自检 ================= */
window.__qa=function(n){
 n=n||300;const errs=[];let ends=0;
 // 静态：next 引用与 alt 枚举
 for(const id in S){const s=S[id];
  if(typeof showEra!=="function")errs.push("showEra 函数缺失");
  if(s.era&&!s.next)errs.push(id+" era 缺少 next");
  if(s.wave&&!WAVES[s.wave])errs.push(id+" 未知风浪 "+s.wave);
  if(s.cardOpts)for(const k in s.cardOpts){if(!CARDS[k])errs.push(id+" 未知卡牌 "+k);
   const c=s.cardOpts[k];if(c.next&&!S[c.next])errs.push(id+" 卡牌选项缺失 "+c.next);}
  if(s.next&&typeof s.next!=="function"&&!S[s.next])errs.push(id+" -> 缺失节点 "+s.next);
  if(s.alt)s.alt.forEach(a=>{if(!S[a])errs.push(id+" alt 缺失 "+a)});
  if(s.choices)s.choices.forEach((c,i)=>{if(c.next&&typeof c.next!=="function"&&!S[c.next])errs.push(id+" 选择"+i+" 缺失 "+c.next)});
  if(!s.lines&&!s.choices&&!s.ending&&!s.hidden&&!s.era&&!s.wave)errs.push(id+" 空节点");}
 // 动态：随机通关
 for(let t=0;t<n;t++){const s0=fresh();let node="c1_1",steps=0;
  try{while(steps++<300){const sc=S[node];
   if(!sc){errs.push("运行期缺失节点 "+node);break;}
   if(sc.ending){ends++;break;}
   if(sc.hidden){node=sc.route(s0);continue;}
   if(sc.wave){const W=WAVES[sc.wave];let t=0;
    while(t++<W.turns){const a=ACTIONS[W.acts[Math.floor(Math.random()*W.acts.length)]];
     const r=a.run(s0,W);applyFx2(s0,r.fx);
     if(Math.random()<0.45&&W.evs.length){const ev=W.evs[Math.floor(Math.random()*W.evs.length)];
      if(ev.fx)applyFx2(s0,ev.fx);
      if(ev.ch)applyFx2(s0,ev.ch[Math.floor(Math.random()*ev.ch.length)].fx);}}
    node=sc.next;continue;}
   if(sc.choices){const ok=sc.choices.filter(c=>reqOk(c));const pick=ok[Math.floor(Math.random()*ok.length)]||sc.choices[0];
    applyFx2(s0,pick.fx);if(pick.set)Object.assign(s0.set,pick.set);node=pick.route?pick.route(s0):pick.next;continue;}
   let nx=sc.next;if(typeof nx==="function")nx=nx(s0);node=nx;}}catch(e){errs.push("异常:"+e.message+" @"+node)}
 }
 return JSON.stringify({errs:errs.slice(0,20),errCount:errs.length,endingsReached:ends,runs:n});
};
function applyFx2(s,fx){if(!fx)return;for(const k in fx){const v=fx[k];if(!v)continue;
 if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(s.aff[id]!==undefined)s.aff[id]=clamp(s.aff[id]+v);continue;}
 if(k==="money")s.money=Math.max(0,s.money+v);else s[k]=clamp(s[k]+v);}}
window.__goto=function(id){st=st||fresh();$("title").classList.remove("show");enter(id);};
window.__st=()=>st;
</script>
